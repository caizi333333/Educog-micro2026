      idle: '<div class="bx">' + bitsV('P1', P1) + '</div>',
      opts: [
        { t: 'ANL P1,#0C0H', B: 3, T: 2, side: '低 6 位被清零', r: '与 0 的位全被清零，低 6 位没了。', anim: function (s) { K.play(s, [['ANL P1,#0C0H', '<div class="bx">' + bitsV('P1', P1 & 0xC0, 'bad') + '</div>']]); } },
        { t: 'ORL P1,#0C0H', ok: 1, B: 3, T: 2, side: '无', r: '或 1 的位变 1，或 0 的位不动。', anim: function (s) { K.play(s, [['P1 或 1100 0000', '<div class="bx">' + bitsV('P1', P1, 'hit') + bitsV('掩码', 0xC0) + '</div>'], ['高 2 位置 1', '<div class="bx">' + bitsV('P1', P1 | 0xC0, 'ok') + '</div>']]); } },
        { t: 'XRL P1,#0C0H', B: 3, T: 2, side: '原来是 1 的位变成 0', r: 'D7 原来就是 1，异或后变成 0，这是翻转，不是置 1。', anim: function (s) { K.play(s, [['XRL P1,#0C0H', '<div class="bx">' + bitsV('P1', P1 ^ 0xC0, 'bad') + '</div>']]); } }
      ],
      ans: 'ORL P1,#0C0H：掩码写 1 的位置 1，写 0 的位保留。',
      why: 'x∨1=1，x∨0=x。要置哪几位，掩码对应位写 1，其余写 0。' },
    { q: '让 P1.0 上的灯<em>每次翻转</em>（亮变灭、灭变亮），其余不动？',
      idle: '<div class="bx">' + bitsV('P1', P1) + '</div>',
      opts: [
        { t: 'ORL P1,#01H', B: 3, T: 2, side: '只能变 1，不会变回 0', r: '执行两次都是 1，灯不闪。', anim: function (s) { K.play(s, [['第 1 次', '<div class="bx">' + bitsV('P1', P1 | 1, 'hit') + '</div>'], ['第 2 次', '<div class="bx">' + bitsV('P1', P1 | 1, 'bad') + '</div>']]); } },
        { t: 'ANL P1,#0FEH', B: 3, T: 2, side: '只能变 0', r: '执行两次都是 0，灯不闪。', anim: function (s) { K.play(s, [['第 1 次', '<div class="bx">' + bitsV('P1', P1 & 0xFE, 'hit') + '</div>'], ['第 2 次', '<div class="bx">' + bitsV('P1', P1 & 0xFE, 'bad') + '</div>']]); } },
        { t: 'XRL P1,#01H', ok: 1, B: 3, T: 2, side: '无', r: '每执行一次，P1.0 翻一次。', anim: function (s) { K.play(s, [['第 1 次', '<div class="bx">' + bitsV('P1', P1 ^ 1, 'hit') + '</div>'], ['第 2 次', '<div class="bx">' + bitsV('P1', P1, 'ok') + '</div>']]); } }
      ],
      ans: 'XRL P1,#01H：掩码写 1 的位翻转，写 0 的位保留。只动一位时也可以用 CPL P1.0（2 字节 1 周期）。',
      why: 'x⊕1 是 x 取反，x⊕0=x。三种运算各有一个“改变值”，正好凑齐对一位能做的三件事：清零、置 1、翻转；另一个值都表示“不动”。' }
  ];
  K.design($('#dzBox'), L, $('#rvBox'));

  /* ② 真值表 */
  var TT = { 'ANL': ['0', '清零', 'x', '保留'], 'ORL': ['x', '保留', '1', '置 1'], 'XRL': ['x', '保留', 'x̄', '翻转'] };
  $('#tt').innerHTML = '<tr><th>掩码位</th><th>ANL（与）</th><th>ORL（或）</th><th>XRL（异或）</th></tr>' + [0, 1].map(function (m) { return '<tr><th>' + m + '</th>' + ['ANL', 'ORL', 'XRL'].map(function (o) { var t = TT[o]; return '<td class="c" data-o="' + o + '" data-m="' + m + '"><b>' + t[m * 2] + '</b><small>' + t[m * 2 + 1] + '</small></td>'; }).join('') + '</tr>'; }).join('');
  $$('#tt td.c').forEach(function (td) { td.onclick = function () { $$('#tt td.c').forEach(function (x) { x.classList.toggle('on', x === td); }); var o = td.dataset.o, m = +td.dataset.m; $('#ttR').innerHTML = 'x 取 0：' + o + ' 得 <b>' + LG.op(o, 0, m) + '</b>；x 取 1：得 <b>' + LG.op(o, 1, m) + '</b>。' + (TT[o][m * 2 + 1] === '保留' ? '和 x 一样，等于没动。' : '改变了这一位。'); }; });
  $('#ttR').innerHTML = '每一列只有一格会改变数据。标志位：目的是 A 时只影响 P；目的是直接地址时，一个标志都不动。';

  /* ③ 位运算 */
  var op = 'ANL', dst = 'A', D = 0xB6, M = 0xF0;
  $('#lgOps').innerHTML = ['ANL', 'ORL', 'XRL'].map(function (o) { return '<button class="btn mono" data-o="' + o + '">' + o + '</button>'; }).join('');
  $('#dst').innerHTML = ['A', 'P1'].map(function (o) { return '<button class="btn sm mono" data-d="' + o + '">' + o + '</button>'; }).join('');
  function rd(el) { var t = el.value.trim().replace(/[hH]$/, ''); var ok = /^[0-9a-fA-F]{1,3}$/.test(t) && parseInt(t, 16) <= 255; el.classList.toggle('bad', !ok); return ok ? parseInt(t, 16) : null; }
  function row(lab, v, key, chgMask) { var h = '<div class="lab">' + lab + '</div><div></div>'; for (var i = 7; i >= 0; i--) { var b = (v >> i) & 1; h += '<div class="bt0 ' + (b ? 'one ' : '') + (key ? 'clk ' : '') + (chgMask != null && ((chgMask >> i) & 1) ? 'chg' : '') + '"' + (key ? ' data-k="' + key + '" data-i="' + i + '"' : '') + '>' + b + '</div>'; } return h; }
  function fl(k, v, why, same) { return '<div class="fl' + (same ? ' same' : '') + '"><span class="k">' + k + '</span><b>' + v + '</b><div>' + why + '</div></div>'; }
  function draw() {
    $$('#lgOps .btn').forEach(function (x) { x.classList.toggle('on', x.dataset.o === op); });
    $$('#dst .btn').forEach(function (x) { x.classList.toggle('on', x.dataset.d === dst); });
    var r = LG.op(op, D, M), chg = r ^ D, hd = '<div class="lab"></div><div></div>';
    for (var i = 7; i >= 0; i--) hd += '<div class="hd">D' + i + '</div>';
    $('#lgCol').innerHTML = '<div class="bits">' + hd + row(dst, D, 'D') + row('掩码', M, 'M') + '<div class="sep"></div>' + row('结果', r, null, chg) + '</div>';
    var n = 0; for (var j = 0; j < 8; j++) n += (chg >> j) & 1;
    var w = { ANL: '掩码为 0 的位被清零', ORL: '掩码为 1 的位被置 1', XRL: '掩码为 1 的位被翻转' }[op];
    $('#lgR').textContent = op + ' ' + dst + ',#' + hx(M) + ' → ' + dst + ' = ' + hx(r);
    $('#lgN').textContent = w + '，这次实际变了 ' + n + ' 位（黄框）。' + (dst === 'A' ? '2 字节 1 周期。' : '3 字节 2 周期，不经 A。');
    var ones = bin(r).split('1').length - 1;
    $('#lgF').innerHTML = (dst === 'A' ? fl('P', LG.P(r), 'A=' + bin(r) + 'B，1 有 ' + ones + ' 个，' + (ones % 2 ? '奇数 → P=1' : '偶数 → P=0')) : fl('P', '—', '目的不是 A，P 不变（P 只跟着 A 走）', 1)) +
      fl('CY', '—', '不变：逐位运算，位和位之间没有进位', 1) + fl('AC', '—', '不变：同上', 1) + fl('OV', '—', '不变：不是加减，谈不上溢出', 1);
    $('#inD').value = hx(D).replace(/^0(?=[A-F])/, '').replace('H', ''); $('#inM').value = hx(M).replace(/^0(?=[A-F])/, '').replace('H', '');
    $$('#lgCol .clk').forEach(function (b) { b.onclick = function () { var i = +b.dataset.i; if (b.dataset.k === 'D') D ^= 1 << i; else M ^= 1 << i; draw(); }; });
  }
  $$('#lgOps .btn').forEach(function (x) { x.onclick = function () { op = x.dataset.o; draw(); }; });
  $$('#dst .btn').forEach(function (x) { x.onclick = function () { dst = x.dataset.d; draw(); }; });
  $('#inD').onchange = function () { var v = rd(this); if (v != null) { D = v; draw(); } };
  $('#inM').onchange = function () { var v = rd(this); if (v != null) { M = v; draw(); } };
  draw();
  var seq = [['ANL', 0xF0], ['ORL', 0x0F], ['XRL', 0x0F]], si = -1;
  K.steppers.hand = function () { si = (si + 1) % seq.length; op = seq[si][0]; M = seq[si][1]; draw(); };

  /* ③ 循环移位：圈上转 */
  var RA = 0xC5, RC = 0, RB = false, RO = 'RLC';
  $('#rOps').innerHTML = ['RL', 'RR', 'RLC', 'RRC'].map(function (o) { return '<button class="btn mono" data-o="' + o + '">' + o + ' A</button>'; }).join('') + '<button class="btn" id="rLoop">转一整圈</button>';
  var RX = { C: 14 }, RY = 46, RD = 118;
  for (var rj = 7; rj >= 0; rj--) RX[rj] = 92 + (7 - rj) * 52;
  var RT = [];
  function rStage() {
    var h = '<div id="rRing" style="position:relative;width:520px;height:150px;margin:6px 0"><svg width="520" height="150" style="position:absolute;left:0;top:0"><defs><marker id="rAr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f4b740"/></marker></defs><path id="rPath" fill="none" stroke="#f4b740" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rAr)"/></svg>';
    h += '<div style="position:absolute;left:' + (RX.C - 2) + 'px;top:18px;width:48px;text-align:center;font-size:13px;color:#94a3b8">CY</div>';
    for (var i = 7; i >= 0; i--) h += '<div style="position:absolute;left:' + RX[i] + 'px;top:18px;width:44px;text-align:center;font-size:13px;color:#94a3b8">D' + i + '</div>';
    for (var k = 0; k < 9; k++) h += '<div class="rtk" id="rtk' + k + '" style="position:absolute;width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 22px var(--fm)"></div>';
    $('#rCol').innerHTML = h + '</div>';
    RT = []; for (var b = 0; b < 8; b++) RT.push({ el: $('#rtk' + b), slot: b, v: (RA >> b) & 1 }); RT.push({ el: $('#rtk8'), slot: 'C', v: RC });
    rPaint();
  }
  function rPaint() {
    RT.forEach(function (t) { t.el.style.left = RX[t.slot] + 'px'; t.el.style.top = RY + 'px'; t.el.textContent = t.v;
      t.el.style.background = t.v ? 'hsl(184 82% 48% / .35)' : 'rgba(255,255,255,.06)'; t.el.style.color = t.v ? '#fff' : '#94a3b8';
      t.el.style.outline = t.slot === 'C' ? '2px solid #f4b740' : 'none'; t.el.style.opacity = (t.slot === 'C' && RO.length === 2) ? .4 : 1; });
    var nine = RO.length === 3, L = nine ? RX.C : RX[7], R = RX[0] + 44, y = RY + 22, yb = RD + 6, left = RO.charAt(1) === 'L';
    // 底边是回头路：左移时从最左回到最右，右移时从最右回到最左
    var d = left ? 'M' + (L + 22) + ',' + (RY + 44) + ' L' + (L + 22) + ',' + yb + ' L' + (R - 22) + ',' + yb + ' L' + (R - 22) + ',' + (RY + 48)
                 : 'M' + (R - 22) + ',' + (RY + 44) + ' L' + (R - 22) + ',' + yb + ' L' + (L + 22) + ',' + yb + ' L' + (L + 22) + ',' + (RY + 48);
    $('#rPath').setAttribute('d', d);
  }
  function rNext(o, slot) { var L = o.charAt(1) === 'L', nine = o.length === 3;
    if (slot === 'C') return L ? 0 : 7;
    if (L) return slot === 7 ? (nine ? 'C' : 0) : slot + 1;
    return slot === 0 ? (nine ? 'C' : 7) : slot - 1; }
  function rWrap(o, slot) { var L = o.charAt(1) === 'L', nine = o.length === 3;
    return L ? (nine ? slot === 'C' : slot === 7) : (nine ? slot === 0 : slot === 0); }
  function rOne(o, done) {
    if (RB) return; RB = true; RO = o; rPaint(); var nine = o.length === 3;
    RT.forEach(function (t) { if (!nine && t.slot === 'C') return;
      var to = rNext(o, t.slot), x0 = RX[t.slot], x1 = RX[to];
      if (rWrap(o, t.slot)) t.el.animate([{ left: x0 + 'px', top: RY + 'px' }, { left: x0 + 'px', top: RD - 16 + 'px', offset: .25 }, { left: x1 + 'px', top: RD - 16 + 'px', offset: .75 }, { left: x1 + 'px', top: RY + 'px' }], { duration: 900, easing: 'ease-in-out' });
      else t.el.animate([{ left: x0 + 'px' }, { left: x1 + 'px' }], { duration: 900, easing: 'ease-in-out' });
      t.slot = to; t.el.style.left = x1 + 'px'; t.el.style.top = RY + 'px'; });
    setTimeout(function () { var r = LG.rot(o, RA, RC); RA = r.A; RC = r.CY;
      var chk = 0, cyv = 0; RT.forEach(function (t) { if (t.slot === 'C') cyv = t.v; else chk |= t.v << t.slot; });
      if (chk !== RA || cyv !== RC) console.error('rot mismatch'); RB = false; rPaint(); rInfo(o); if (done) done(); }, 920);
  }
  function rInfo(o) { $('#rC').textContent = RC;
    $('#rR').innerHTML = (o ? '<b class="mono">' + o + ' A</b>：' + (o.length === 3 ? 'CY 在圈里，9 位一起转。' : 'CY 不进圈，只有 A 的 8 位转。') + '1 字节 1 周期。<br>' : '') + 'A = ' + hx(RA) + '，CY = ' + RC + '，P = ' + LG.P(RA); }
  function rSet() { RT.forEach(function (t, b) { t.v = b < 8 ? (RA >> b) & 1 : RC; t.slot = b < 8 ? b : 'C'; }); rPaint(); }
  $$('#rOps .btn[data-o]').forEach(function (x) { x.onclick = function () { $$('#rOps .btn[data-o]').forEach(function (y) { y.classList.toggle('on', y === x); }); rOne(x.dataset.o); }; });
  $('#rLoop').onclick = function () { if (RB) return; var o = RO, n = o.length === 3 ? 9 : 8, k = 0, a0 = RA, c0 = RC;
    (function go() { if (k++ < n) { $('#rR').innerHTML = '<b class="mono">' + o + ' A</b> 第 ' + k + ' / ' + n + ' 次……'; rOne(o, function () { setTimeout(go, 150); }); }
      else $('#rR').innerHTML = '<b class="mono">' + o + ' A</b> 连做 ' + n + ' 次，A = ' + hx(RA) + '，CY = ' + RC + (RA === a0 && RC === c0 ? '，又回到了起点：' + (n === 9 ? '9 位的圈要转 9 次。' : '8 位的圈转 8 次。') : '。'); })(); };
  $('#rC').onclick = function () { if (RB) return; RC ^= 1; rSet(); rInfo(); };
  $('#inR').onchange = function () { var v = rd(this); if (v != null && !RB) { RA = v; rSet(); rInfo(); } };
  $('#rRe').onclick = function () { if (RB) return; RA = 0xC5; RC = 0; $('#inR').value = 'C5'; rSet(); $('#rR').innerHTML = '课件第 96 页初值：A = ' + hx(RA) + '，CY = ' + RC + '，P = ' + LG.P(RA); };
  rStage(); $$('#rOps .btn[data-o="RLC"]')[0].classList.add('on');
  $('#rR').innerHTML = '课件第 96 页初值：A = ' + hx(RA) + '，CY = ' + RC + '，P = ' + LG.P(RA) + '。点一条指令，看各位怎么走。';

  K.quiz($('#qzBox'), $('#qzS'), [
    { t: 'A=0C3H，R0=0FH，执行 ANL A,R0 后 A=？', o: ['03H', '0CFH', '0CCH'], a: 0, e: '0FH 做掩码：高 4 位清零，低 4 位保留。' },
    { t: '要把 30H 单元的 D7 翻转，其余不动：', o: ['ORL 30H,#80H', 'XRL 30H,#80H', 'ANL 30H,#7FH'], a: 1, e: '翻转用异或，掩码只在 D7 写 1。' },
    { t: 'ANL P1,#0F0H 几字节、几个周期？', o: ['2 字节 1 周期', '3 字节 2 周期', '3 字节 1 周期'], a: 1, e: '操作码 + 地址 + 立即数 = 3 字节；3 字节指令都是 2 个周期。' },
    { t: 'A=11000101B，执行 CPL A 后 P 怎么变？', o: ['不变', '变成相反', '变成 0'], a: 0, e: '8 位全翻，1 的个数从 n 变成 8−n，奇偶不变。' }
  ]);
})();
</script>
</body></html>
