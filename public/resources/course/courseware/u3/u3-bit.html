<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>位操作｜单元 3 指令系统（单文件版）</title>
<!-- 单文件版：由 build_单文件.py 自动生成，请勿直接编辑；

<!-- 内联自 lib/kp-theme.css -->
<style>
/* ============================================================
   kp-theme.css · 知识点讲解页 · 平台同源主题
   ------------------------------------------------------------
   设计令牌直接取自 sunyancai.top 运行时（shadcn/ui + Tailwind 深色主题），
   目的是嵌进平台后看不出是外来的：
     --background 220 18% 7%     底色
     --primary    184 82% 48%    青（主色）
     --accent     42 92% 58%     琥珀（强调）
     --border     205 16% 18%
     --radius     0.5rem
   页面底纹：左上青、右上琥珀两道径向光晕
   标题渐变：linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859)
   面板写法：色/[0.08] 底 + 色/25 描边 + 6px 圆角 + 44px 触控高度
   ============================================================ */
:root{
  --bg:hsl(220 18% 7%);
  --bg-deep:#070a0d;
  --fg:hsl(190 32% 94%);
  --card:hsl(220 15% 11%);
  --popover:hsl(220 14% 13%);
  --primary:hsl(184 82% 48%);
  --secondary:hsl(210 14% 16%);
  --muted:hsl(210 12% 15%);
  --muted-fg:hsl(195 13% 62%);
  --accent:hsl(42 92% 58%);
  --destructive:hsl(0 72% 51%);
  --border:hsl(205 16% 18%);
  --ring:hsl(184 82% 48%);
  --c1:hsl(184 82% 48%);   /* 青 */
  --c2:hsl(154 62% 48%);   /* 绿 */
  --c3:hsl(42 92% 58%);    /* 金 */
  --c4:hsl(210 80% 62%);   /* 蓝 */
  --c5:hsl(348 72% 62%);   /* 品红 */
  --radius:.5rem;
  --slate100:#f1f5f9; --slate300:#cbd5e1; --slate400:#94a3b8;
  --cyan100:#cffafe; --cyan300:#67e8f9;
  --emerald200:#a7f3d0; --emerald300:#6ee7b7;
  --amber200:#fde68a; --amber300:#fcd34d;
  --rose300:#fda4af;
  /* 正文 Inter 打头，后面接中文字体；平台正文即 Inter */
  --fs:Inter,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg-deep);
  background-image:
    radial-gradient(circle at 14% 10%,rgba(22,209,223,.10),transparent 28rem),
    radial-gradient(circle at 88% 18%,rgba(246,187,49,.08),transparent 26rem);
  background-attachment:fixed;
  color:var(--slate100);font-family:var(--fs);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.kp-wrap{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.kp-fade{animation:kpFade .4s ease-out both}
@keyframes kpFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 头部 ---------- */
.kp-eyebrow{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:10px}
.kp-eyebrow b{color:var(--cyan300);font-weight:600}
h1.kp-h1{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1.25;
  background-image:linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859);
  background-clip:text;-webkit-background-clip:text;color:transparent}
@media(min-width:768px){h1.kp-h1{font-size:30px}}
.kp-lead{margin-top:12px;max-width:72ch;color:var(--slate300);font-size:15px;line-height:1.7}
.kp-lead b{color:var(--cyan100);font-weight:600}
.kp-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kp-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:6px 10px}
.kp-chip b{color:var(--cyan300);font-weight:600}

/* ---------- 标签页（沿用平台自身的 tab 写法） ---------- */
.kp-tabs{display:flex;gap:8px;margin-top:22px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:5px}
.kp-tab{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:6px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s;font-family:var(--fs)}
.kp-tab:hover{color:var(--slate100);background:rgba(255,255,255,.06)}
.kp-tab[aria-selected="true"]{color:var(--cyan100);background:rgba(103,232,249,.12);
  border-color:rgba(103,232,249,.25)}
.kp-tab .n{font-family:var(--fm);font-size:11px;opacity:.8}
.kp-panel{display:none;margin-top:18px}
.kp-panel.on{display:block;animation:kpFade .3s ease-out both}

/* ---------- 通用面板 ---------- */
.kp-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:18px 20px}
.kp-card + .kp-card{margin-top:12px}
.kp-card h2{font-size:16px;font-weight:600;letter-spacing:-.2px;margin-bottom:6px;color:var(--slate100)}
.kp-card h3{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:12px}
.kp-card p{font-size:14px;line-height:1.75;color:var(--slate300)}
.kp-card p + p{margin-top:9px}
.kp-card b{color:var(--cyan100);font-weight:600}
.kp-note{font-size:13px;color:var(--muted-fg);line-height:1.7}

/* 图舞台 */
.kp-stage{position:relative;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px;overflow:hidden}
.kp-stage svg{width:100%;height:auto;display:block}
.kp-stagecap{font-family:var(--fm);font-size:11px;color:var(--muted-fg);
  margin-top:8px;text-align:center}

/* 控件行 */
.kp-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.kp-btn{min-height:44px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border-radius:6px;padding:8px 13px;font-family:var(--fm);font-size:12px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s}
.kp-btn:hover{color:var(--slate100);border-color:rgba(255,255,255,.18)}
.kp-btn.on{color:var(--cyan100);background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.25)}
.kp-btn.go{color:var(--emerald200);background:rgba(110,231,183,.08);border-color:rgba(110,231,183,.25)}
.kp-btn.go:hover{background:rgba(110,231,183,.14)}

/* 读数格 */
.kp-reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.kp-read{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:9px 11px}
.kp-read .k{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg)}
.kp-read .v{font-family:var(--fm);font-size:15px;font-weight:600;margin-top:5px;color:var(--slate100)}
.kp-read .v.hi{color:var(--cyan300)}.kp-read .v.lo{color:var(--slate400)}
.kp-read .v.warn{color:var(--rose300)}.kp-read .v.gold{color:var(--amber300)}

/* ---------- 疑点卡 ---------- */
.kp-pit{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--c5);border-radius:0 8px 8px 0;padding:16px 18px}
.kp-pit + .kp-pit{margin-top:11px}
.kp-pit .no{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--rose300);
  text-transform:uppercase}
.kp-pit .q{font-size:15px;font-weight:600;margin-top:7px;color:var(--slate100);line-height:1.55}
.kp-pit dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline}
.kp-pit dt{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg);white-space:nowrap}
.kp-pit dd{font-size:13.5px;line-height:1.7;color:var(--slate300)}
.kp-pit dd b{color:var(--cyan100)}
.kp-pit .right{color:var(--emerald200)}
.kp-pit .right b{color:var(--emerald300)}

/* ---------- 自测 ---------- */
.kp-q{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:16px 18px}
.kp-q + .kp-q{margin-top:11px}
.kp-q .qh{display:flex;gap:10px;align-items:baseline}
.kp-q .qn{font-family:var(--fm);font-size:11px;color:var(--cyan300);flex:none}
.kp-q .qt{font-size:14.5px;font-weight:600;line-height:1.6;color:var(--slate100)}
.kp-opt{display:block;width:100%;text-align:left;cursor:pointer;margin-top:8px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:6px;
  padding:10px 13px;color:var(--slate300);font-size:13.5px;line-height:1.55;
  font-family:var(--fs);transition:.16s;min-height:44px}
.kp-opt:hover{border-color:rgba(255,255,255,.16);color:var(--slate100)}
.kp-opt.ok{background:rgba(110,231,183,.09);border-color:rgba(110,231,183,.3);color:var(--slate100)}
.kp-opt.no{background:rgba(253,164,175,.09);border-color:rgba(253,164,175,.3)}
.kp-opt.lock{pointer-events:none;opacity:.5}
.kp-opt.lock.ok,.kp-opt.lock.no{opacity:1}
.kp-exp{margin-top:11px;font-size:13px;line-height:1.72;color:var(--slate300);
  background:rgba(255,255,255,.02);border-left:3px solid var(--c2);
  border-radius:0 6px 6px 0;padding:11px 13px;display:none}
.kp-exp.show{display:block}
.kp-exp.bad{border-left-color:var(--c5)}
.kp-score{font-family:var(--fm);font-size:12px;color:var(--slate300);text-align:right;margin-top:12px}
.kp-score b{color:var(--cyan300);font-size:15px}

/* ---------- 页脚 ---------- */
.kp-foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:12px;line-height:1.8;color:var(--muted-fg)}
.kp-foot b{color:var(--slate300)}
.kp-rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kp-rel a{text-decoration:none}

/* 嵌入模式：被 iframe 装载时去掉多余留白 */
body.kp-embed .kp-wrap{padding-top:14px;padding-bottom:22px}
body.kp-embed .kp-foot{display:none}
@media(max-width:640px){
  .kp-tabs{flex-direction:column}
  .kp-wrap{padding:16px 12px 40px}
}

/* ---------- 章节导航条（第三章起启用；第二章各篇不传 nav，不出现） ---------- */
.kp-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;padding-bottom:2px}
.kp-nav::-webkit-scrollbar{display:none}
.kp-nav-i{flex:none;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:44px;
  padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);
  color:var(--slate300);text-decoration:none;transition:.16s}
.kp-nav-i .t{font-size:13px;font-weight:600;white-space:nowrap}
.kp-nav-i .s{font-family:var(--fm);font-size:10.5px;opacity:.62;white-space:nowrap}
a.kp-nav-i:hover{color:var(--slate100);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.kp-nav-i.on{color:var(--cyan100);background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.25)}
.kp-nav-i.soon{opacity:.42;cursor:default}
.kp-embed .kp-nav{margin-bottom:12px}

</style>
<!-- 内联自 lib/u3.css -->
<style>
/* ============================================================
   u3.css · 第三章共用样式
   在 kp-theme.css 之上加：团队色、机器码剖面、寻址方式标签、
   "跑一次"前后对照。全景图与各篇共用。
   ============================================================ */
:root{
  --t-mov:hsl(207 82% 64%); --t-alu:hsl(352 78% 66%); --t-logic:hsl(152 56% 52%);
  --t-jump:hsl(27 90% 61%); --t-bit:hsl(266 72% 72%);
  --data:hsl(184 82% 55%);     /* 数的流动 */
  --addr:hsl(42 92% 60%);      /* 门牌（地址）的流动 */
}

/* ---------- 机器码剖面 ---------- */
.cp{border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(0,0,0,.32);padding:10px 11px}
.cp-row{display:flex;align-items:stretch;gap:5px;flex-wrap:wrap}
.cp-b{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;padding:5px 7px;
  border-radius:5px;animation:cpPop .32s cubic-bezier(.34,1.5,.64,1) both}
.cp-b b{font-family:var(--fm);font-size:13.5px;font-weight:700;line-height:1.2}
.cp-b i{font-style:normal;font-size:9.5px;opacity:.72;margin-top:1px}
.cp-b.opc{background:rgba(22,209,223,.16);color:var(--cyan300);border:1px solid rgba(103,232,249,.32)}
.cp-b.arg{background:rgba(246,187,49,.14);color:var(--amber300);border:1px solid rgba(246,187,49,.3)}
.cp-len{align-self:center;margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--muted-fg)}
@keyframes cpPop{from{opacity:0;transform:translateY(-5px) scale(.9)}to{opacity:1;transform:none}}
.cp-bits{display:flex;gap:3px;margin-top:8px}
.cp-bits span{flex:1;max-width:30px;text-align:center;font-family:var(--fm);font-size:11.5px;padding:3px 0;border-radius:3px;
  background:rgba(22,209,223,.09);color:var(--cyan300);border:1px solid rgba(103,232,249,.18)}
.cp-bits span.var{background:rgba(246,187,49,.2);color:var(--amber200);border-color:rgba(246,187,49,.45);font-weight:700}
.cp-leg{margin-top:8px;font-size:11.5px;line-height:1.78;color:var(--muted-fg)}
.cp-leg b{color:var(--slate300);font-weight:600}
.cp-leg i{font-style:normal;font-family:var(--fm);padding:0 4px;border-radius:3px}
.cp-leg i.opc{background:rgba(22,209,223,.16);color:var(--cyan300)}
.cp-leg i.arg{background:rgba(246,187,49,.14);color:var(--amber300)}

/* ---------- 寻址方式标签 ---------- */
.mchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 9px;border-radius:5px;margin:0 5px 5px 0;
  font-size:11.5px;color:var(--slate300);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  text-decoration:none;transition:.15s}
.mchip b{font-family:var(--fm);font-size:11px;color:var(--amber300)}
a.mchip:hover{color:var(--cyan100);border-color:rgba(103,232,249,.3);background:rgba(103,232,249,.08)}
.mchip.none{color:var(--muted-fg);cursor:default}

/* ---------- 跑一次 ---------- */
.run{border:1px solid rgba(110,231,183,.22);border-radius:6px;background:rgba(16,185,129,.05);padding:9px 10px}
.run-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.run-hd code{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--emerald200)}
.run-mc{font-family:var(--fm);font-size:11px;color:var(--cyan300)}
.run-cy{font-family:var(--fm);font-size:10.5px;color:var(--muted-fg);margin-left:auto}
.run-note{font-size:11.5px;color:var(--slate300);line-height:1.7;margin-top:5px}
.run-tb{margin-top:7px;display:grid;gap:3px}
.run-row{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto 1fr;align-items:center;gap:6px;
  font-family:var(--fm);font-size:12px;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.25);
  animation:runIn .36s cubic-bezier(.22,1,.36,1) both}
.run-row .k{color:var(--slate300)}
.run-row .o{color:var(--muted-fg);text-align:right}
.run-row .ar{color:var(--muted-fg);font-size:11px}
.run-row .n{color:var(--emerald200);font-weight:700}
.run-row.same .n{color:var(--muted-fg);font-weight:400}
@keyframes runIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.run-jump{margin-top:6px;font-size:11.5px;color:var(--slate300)}
.run-jump b{color:var(--amber300);font-family:var(--fm)}
.run-err{font-size:12px;color:var(--rose300)}

@media (prefers-reduced-motion:reduce){.cp-b,.run-row{animation:none}}

/* ============================================================
   取数现场（u3-machine.js）
   ============================================================ */
.mf{width:100%;height:auto;display:block;font-family:var(--fs)}
.mf-h{font-size:13px;font-weight:700;fill:var(--slate100)}
.mf-hs{font-size:11px;font-weight:400;fill:var(--amber300)}
.mf-a{font-family:var(--fm);font-size:9.5px;fill:var(--muted-fg)}
.mf-a2{font-family:var(--fm);font-size:11px;fill:var(--muted-fg)}
.mf-s{font-size:11px;fill:var(--muted-fg)}
.mf-dis{font-family:var(--fm);font-size:17px;font-weight:700;fill:var(--cyan100)}
.mf-rn{font-family:var(--fm);font-size:15px;font-weight:700;fill:var(--slate100)}
.mf-rn.dyn{fill:var(--amber200);font-size:12.5px}
.mf-an{font-size:10.5px;fill:var(--amber300);opacity:.9}
.mf-cell rect{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.14);stroke-width:1;transition:fill .3s,stroke .3s}
.mf-v{font-family:var(--fm);font-size:14px;font-weight:700;fill:var(--slate100)}
.mf-v.big{font-size:22px}
.mf-cell.code rect{fill:rgba(246,187,49,.10);stroke:rgba(246,187,49,.35)}
.mf-cell.code .mf-v{fill:var(--amber300)}
.mf-cell.code.opc rect{fill:rgba(22,209,223,.13);stroke:rgba(103,232,249,.4)}
.mf-cell.code.opc .mf-v{fill:var(--cyan300)}
.mf-cell.code.off rect{fill:transparent;stroke:rgba(255,255,255,.05);stroke-dasharray:3 3}
.mf-cell.reg rect{fill:rgba(255,255,255,.05)}
.mf-cell.flag rect{fill:rgba(255,255,255,.04)}
.mf-cell.flag.up rect{fill:rgba(246,187,49,.2);stroke:var(--addr)}
.mf-cell.bit rect{rx:4}
.mf-cell.bit.one rect{fill:rgba(22,209,223,.16);stroke:rgba(103,232,249,.4)}
.mf-cell.mem.dyn rect{fill:transparent;stroke:rgba(255,255,255,.07);stroke-dasharray:3 3}
.mf-cell.mem.dyn.on rect{fill:rgba(246,187,49,.08);stroke:rgba(246,187,49,.35);stroke-dasharray:none}
.mf-cell.rom rect{fill:rgba(255,255,255,.03)}
.mf-cell.rom.mark rect{fill:rgba(246,187,49,.1);stroke:rgba(246,187,49,.35)}
.mf-cell.gap rect{fill:transparent;stroke:transparent}
.mf-cell.sm .mf-v{font-size:11.5px}
.mf-cell.hot rect{stroke:var(--data);stroke-width:2;fill:rgba(22,209,223,.14)}
.mf-cell.hot2 rect{stroke:var(--addr);stroke-width:2}
.mf-cell.ghostHot rect{stroke:rgba(203,213,225,.55);stroke-width:1.5;stroke-dasharray:4 3}
.mf-cell.flash rect{animation:mfFlash .9s ease-out}
@keyframes mfFlash{0%{fill:rgba(110,231,183,.45)}100%{}}
.mf-adder circle{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.18);transition:.3s}
.mf-adder text{font-family:var(--fm);font-size:16px;font-weight:700;fill:var(--muted-fg)}
.mf-adder.on circle{fill:rgba(246,187,49,.18);stroke:var(--addr)}
.mf-adder.on text{fill:var(--amber200)}
.mf-p{fill:none;stroke-width:2.4;stroke-linecap:round}
.mf-p.data{stroke:var(--data)}
.mf-p.addr{stroke:var(--addr);stroke-dasharray:7 5}
.mf-p.ghost{stroke:rgba(203,213,225,.5);stroke-dasharray:4 5;stroke-width:1.8}
.mf-tok circle{stroke-width:1.5}
.mf-tok.data circle{fill:hsl(184 70% 18%);stroke:var(--data)}
.mf-tok.addr circle{fill:hsl(42 60% 16%);stroke:var(--addr)}
.mf-tok text{font-family:var(--fm);font-size:10px;font-weight:700;fill:#fff}

<script>
/* ============================================================
   kp-shell.js · 知识点讲解页 · 共用外壳
   ------------------------------------------------------------
   六个知识点页共用这一套结构，保证"每篇能独立成篇、彼此风格统一"：

     眉标（单元 · 知识点编号）
     渐变大标题
     一句话定位：这个点为什么容易错
     元信息 chip（对应大纲章节 / 教材图表 / 预计用时）
     ┌ 标签页 ────────────────────────┐
     │ 讲解  —— 可交互的图 + 分步说明      │
     │ 疑点  —— 学生最常错的地方，现象→原因→正解 │
     │ 自测  —— 2~3 题，即时给解析         │
     └───────────────────────────┘
     相关知识点 + 出处

   页面只需提供数据，外壳负责渲染与交互。
   被 iframe 嵌入时自动加 .kp-embed（收紧留白、隐去页脚）。
   ============================================================ */
(function (global) {
  'use strict';

  function h(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* 允许在文案里用 **加粗** 和 `等宽` 两种极简标记，省得到处写标签 */
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`(.+?)`/g, '<code style="font-family:var(--fm);font-size:.92em;' +
        'background:rgba(255,255,255,.05);border-radius:4px;padding:1px 5px">$1</code>');
  }

  function KP(cfg) {
    /* 被 iframe 装着就进嵌入模式 */
    try { if (global.self !== global.top) document.body.classList.add('kp-embed'); } catch (e) {
      document.body.classList.add('kp-embed');
    }
    document.title = cfg.kp + '｜' + cfg.unit;

    var wrap = h('div', { class: 'kp-wrap kp-fade' });
    document.body.appendChild(wrap);

    /* ---- 章节导航条（可选；第二章各篇不传，渲染结果不变） ---- */
    if (cfg.nav && cfg.nav.length) wrap.insertAdjacentHTML('beforeend', KP.navHTML(cfg.nav));

    /* ---- 头部 ---- */
    wrap.appendChild(h('div', { class: 'kp-eyebrow' },
      esc(cfg.unitEn || 'KNOWLEDGE POINT') + ' · <b>' + esc(cfg.unit) + '</b>'));
    wrap.appendChild(h('h1', { class: 'kp-h1' }, esc(cfg.kp)));
    wrap.appendChild(h('p', { class: 'kp-lead' }, md(cfg.lead)));
    if (cfg.meta && cfg.meta.length) {
      wrap.appendChild(h('div', { class: 'kp-meta' },
        cfg.meta.map(function (m) {
          return '<span class="kp-chip">' + (m[1] ? '<b>' + esc(m[0]) + '</b>' + esc(m[1]) : esc(m[0])) + '</span>';
        }).join('')));
    }

    /* ---- 标签页 ---- */
    var TABS = [
      { k: 'teach', n: '01', t: '讲解' },
      { k: 'pit', n: '02', t: '疑点' },
      { k: 'quiz', n: '03', t: '自测' }
    ].filter(function (t) {
      return t.k === 'teach' ? !!cfg.teach : (t.k === 'pit' ? (cfg.pitfalls || []).length : (cfg.quiz || []).length);
    });

    var tabsEl = h('div', { class: 'kp-tabs', role: 'tablist' });
    var panels = {};
    TABS.forEach(function (t, i) {
      var b = h('button', {
        class: 'kp-tab', role: 'tab', 'aria-selected': i === 0 ? 'true' : 'false',
        'data-k': t.k
      }, '<span class="n">' + t.n + '</span>' + t.t);
      b.onclick = function () { select(t.k); };
      tabsEl.appendChild(b);
      var p = h('div', { class: 'kp-panel' + (i === 0 ? ' on' : ''), role: 'tabpanel' });
      panels[t.k] = p;
    });
    wrap.appendChild(tabsEl);
    TABS.forEach(function (t) { wrap.appendChild(panels[t.k]); });

    function select(k) {
      Array.prototype.forEach.call(tabsEl.children, function (b) {
        b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false');
      });
      for (var key in panels) panels[key].classList.toggle('on', key === k);
      if (k === 'teach' && cfg.onShowTeach) cfg.onShowTeach();
    }

    /* ---- 讲解 ---- */
    if (cfg.teach) {
      var tp = panels.teach;
      if (cfg.teach.intro) {
        tp.appendChild(h('div', { class: 'kp-card' }, '<p>' + md(cfg.teach.intro) + '</p>'));
      }
      var stageCard = h('div', { class: 'kp-card' });
      if (cfg.teach.title) stageCard.appendChild(h('h3', null, esc(cfg.teach.title)));
      var ctl = h('div', { class: 'kp-ctl', id: 'kpCtl' });
      stageCard.appendChild(ctl);
      var stage = h('div', { class: 'kp-stage', id: 'kpStage' });
      stageCard.appendChild(stage);
      if (cfg.teach.caption) stageCard.appendChild(h('div', { class: 'kp-stagecap' }, esc(cfg.teach.caption)));
      var reads = h('div', { class: 'kp-reads', id: 'kpReads', style: 'margin-top:12px' });
      stageCard.appendChild(reads);
      var say = h('div', { class: 'kp-card', id: 'kpSay', style: 'margin-top:12px' },
        '<h3>当前在讲什么</h3><p id="kpSayT"></p>');
      stageCard.appendChild(say);
      tp.appendChild(stageCard);
      if (cfg.teach.steps && cfg.teach.steps.length) {
        var sc = h('div', { class: 'kp-card' });
        sc.appendChild(h('h3', null, '要点顺序'));
        sc.appendChild(h('div', null, cfg.teach.steps.map(function (s, i) {
          return '<p><b>' + (i + 1) + '.</b> ' + md(s) + '</p>';
        }).join('')));
        tp.appendChild(sc);
      }
      KP.ctl = ctl; KP.stage = stage; KP.reads = reads;
      KP.say = function (t) { document.getElementById('kpSayT').innerHTML = md(t); };
    }

    /* ---- 疑点 ---- */
    if ((cfg.pitfalls || []).length) {
      var pp = panels.pit;

      cfg.pitfalls.forEach(function (p, i) {

        el.innerHTML =
          '<div class="no">疑点 ' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="q">' + md(p.q) + '</div>' +
          '<dl>' +
          '<dt>常见说法</dt><dd>' + md(p.say) + '</dd>' +
          '<dt>为什么错</dt><dd>' + md(p.why) + '</dd>' +
          '<dt class="right">正确理解</dt><dd class="right">' + md(p.right) + '</dd>' +
          '</dl>';
        pp.appendChild(el);
      });
    }

    /* ---- 自测 ---- */
    if ((cfg.quiz || []).length) {
      var qp = panels.quiz, right = 0, answered = 0;
      var score = h('div', { class: 'kp-score' });
      cfg.quiz.forEach(function (item, i) {
        var q = h('div', { class: 'kp-q' });
        q.appendChild(h('div', { class: 'qh' },
          '<span class="qn">Q' + (i + 1) + '</span><span class="qt">' + md(item.q) + '</span>'));

            Array.prototype.forEach.call(q.querySelectorAll('.kp-opt'), function (x, k) {
              x.classList.add('lock');
              if (k === item.a) x.classList.add('ok');

  KP.navHTML = function (items) {

      if (it.soon || it.on) return '<span class="' + cls + '"' + (it.on ? ' aria-current="page"' : '') + '>' + inner + '</span>';

  KP.buttons = function (items, onPick, initial) {

      b.textContent = it.t;
      b.dataset.k = it.k;
      b.onclick = function () { pick(it.k); };
      KP.ctl.appendChild(b);
      return b;
    });
    function pick(k) {
      btns.forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });

    }
    pick(initial || items[0].k);

  /* ---- 章节导航：做好一篇就把 soon 去掉 ---- */
  var PAGES = [
    { k: 'map',  t: '指令全景图',   sub: '111 条 · 256 格', href: 'u3-isa-map.html' },
    { k: '3.1',  t: '3.1 寻址方式', sub: '七种',            href: 'u3-addressing.html' },
    { k: '3.2',  t: '3.2 数据传送', sub: '29 条',           href: 'u3-transfer.html' },
    { k: '3.3',  t: '3.3 算术运算', sub: '24 条',           href: 'u3-arith.html' },
    { k: '3.4',  t: '3.4 逻辑运算', sub: '25 条',           href: 'u3-logic.html' },
    { k: '3.5',  t: '3.5 控制转移', sub: '16 条 + NOP',           href: 'u3-jump.html' },
    { k: '3.6',  t: '3.6 位操作',   sub: '17 条',           href: 'u3-bit.html' }
  ];
  function nav(cur) {
    return PAGES.map(function (p) {
      return { t: p.t, sub: p.soon ? '制作中' : p.sub, href: p.href, on: p.k === cur, soon: !!p.soon };
    });
  }
  function pageFor(kp) {
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].k === kp) return PAGES[i];
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function hex2(n) { return (n < 16 ? '0' : '') + (n & 0xFF).toString(16).toUpperCase(); }

  /* ============================================================
     机器码剖面
     ins：指令条目；bytes：可选的实际机器码（给了就显示真值）
     ============================================================ */
  function opcodeBits(ins) {
    var span = ins.span || 1, step = ins.step || 1, code = ins.code, bits = [];
    for (var i = 7; i >= 0; i--) bits.push({ v: (code >> i) & 1, var: false, lab: '' });
    if (span > 1 && step === 1) {                       // Rn：低 3 位；@Ri：最低 1 位
      var nb = span === 8 ? 3 : 1;
      for (var j = 0; j < nb; j++) { bits[7 - j].var = true; bits[7 - j].lab = span === 8 ? 'r' : 'i'; }
    }
    if (span > 1 && step === 0x20) {                    // addr11：高 3 位是 a10 a9 a8
      ['a10', 'a9', 'a8'].forEach(function (l, j) { bits[j].var = true; bits[j].lab = l; });
    }
    return bits;
  }

  function codeProfile(ins, bytes) {
    var span = ins.span || 1, step = ins.step || 1, cells = [], leg = [];
    var real = bytes && bytes.length === ins.bytes;
    cells.push({ t: 'opc', v: real ? hex2(bytes[0]) : hex2(ins.code) + (span > 1 ? '+' + (step === 0x20 ? 'n·20' : 'n') : ''), s: '操作码' });

    var ops = ins.ops ? ins.ops.split(',') : [], k = 1;
    var argLab = { '#data': ['data', '立即数：指令自带的那个数'],
                   'direct': ['direct', '直接地址：片内 RAM 或 SFR 的门牌号'],
                   'bit': ['bit', '位地址：00H~7FH 在 20H~2FH，80H 起在可位寻址的 SFR'],
                   '/bit': ['bit', '位地址（/ 只是写法，机器码另用一个操作码区分）'],
                   'rel': ['rel', '8 位补码偏移，基准是下一条指令的地址——只能跳 −128~+127'] };
    if (ins.enc === 'src-first') {
      cells.push({ t: 'arg', v: real ? hex2(bytes[1]) : 'direct₂', s: '源' });
      cells.push({ t: 'arg', v: real ? hex2(bytes[2]) : 'direct₁', s: '目的' });
      leg.push('<i class="arg">源 目的</i> 注意顺序：机器码里<b>源地址在前、目的地址在后</b>，和汇编书写顺序相反');
    } else {
      ops.forEach(function (o) {
        if (o === '#data16' || o === 'addr16') {
          var hi = o === '#data16' ? 'dH' : 'aH', lo = o === '#data16' ? 'dL' : 'aL';
          cells.push({ t: 'arg', v: real ? hex2(bytes[k]) : hi, s: '高字节' });
          cells.push({ t: 'arg', v: real ? hex2(bytes[k + 1]) : lo, s: '低字节' });
          leg.push('<i class="arg">' + hi + ' ' + lo + '</i> ' + (o === '#data16' ? '16 位立即数' : '16 位目标地址，64KB 内任意一点') + '，<b>高字节在前</b>');
          k += 2;
        } else if (o === 'addr11') {
          cells.push({ t: 'arg', v: real ? hex2(bytes[k]) : 'a7~0', s: '低 8 位' });
          leg.push('<i class="arg">a7~0</i> 目标地址低 8 位；a10~a8 藏在操作码高 3 位里——所以只能在同一个 2KB 区里跳');
          k += 1;
        } else if (argLab[o]) {
          cells.push({ t: 'arg', v: real ? hex2(bytes[k]) : argLab[o][0], s: o === 'rel' ? '偏移' : (o === '#data' ? '数' : '门牌') });
          leg.push('<i class="arg">' + argLab[o][0] + '</i> ' + argLab[o][1]);
          k += 1;
        }
      });
    }
    if (span > 1) {
      leg.unshift('<i class="opc">' + I.codeRange(ins) + '</i> 这条指令独占 ' + span + ' 个操作码。' +
        (step === 0x20 ? '目标地址的高 3 位写进了操作码' : (span === 8 ? '寄存器号 R0~R7 写进了操作码低 3 位' : '寄存器号 R0/R1 写进了操作码最低位')) +
        '——所以不额外占字节');
    } else {
      leg.unshift('<i class="opc">' + I.codeRange(ins) + '</i> 操作码：告诉 CPU "做什么"');
    }

    var html = '<div class="cp"><div class="cp-row">' + cells.map(function (c, i) {
      return '<span class="cp-b ' + c.t + '" style="animation-delay:' + (i * 0.07) + 's"><b>' + c.v + '</b><i>' + c.s + '</i></span>';
    }).join('') + '<span class="cp-len">' + ins.bytes + ' 字节</span></div>';

    if (span > 1) {
      html += '<div class="cp-bits" title="操作码逐位">' + opcodeBits(ins).map(function (b) {
        return '<span class="' + (b.var ? 'var' : '') + '">' + (b.var ? b.lab : b.v) + '</span>';
      }).join('') + '</div>';
    }
    html += '<div class="cp-leg">' + leg.join('<br>') + '</div></div>';
    return html;
  }

  /* ---- 寻址方式标签：点了去 3.1 看这种方式的动画 ---- */
  function modeChips(ins) {
    var ms = I.modesOf(ins);
    if (!ms.length) return '<span class="mchip none">转移目标地址直接写在指令里</span>';
    return ms.map(function (k) {
      var md = I.MODES[k];
      return '<a class="mchip" href="u3-addressing.html#m=' + k + '" title="' + esc(md.say) + '">' +
        '<b>' + esc(md.mark) + '</b>' + esc(md.name) + '</a>';
    }).join('');
  }

  /* ============================================================
     "跑一次"：在统一初态上执行，列出变了什么
     ============================================================ */
  var KIND_LABEL = function (e) {
    switch (e.kind) {
      case 'A': return 'A';
      case 'B': return 'B';
      case 'R': return 'R' + e.addr;
      case 'iram': return '(' + M.hb(e.addr) + ')';
      case 'sfr': return M.SFR_NAME[e.addr] || '(' + M.hb(e.addr) + ')';
      case 'xram': return '片外(' + M.hw(e.addr) + ')';
      case 'bit': return '位 ' + M.bitText(e.addr);
      case 'C': return 'CY';
      case 'flag': return e.addr;
      case 'DPTR': return 'DPTR';
      case 'SP': return 'SP';
      case 'PC': return 'PC';
    }
    return e.kind;
  };
  function fmtVal(e) {
    if (e.kind === 'C' || e.kind === 'flag' || e.kind === 'bit') return String(e.val);
    if (e.kind === 'DPTR' || e.kind === 'PC' || (e.kind === 'xram' && false)) return M.hw(e.val);
    return M.hb(e.val);
  }
  function fmtOld(e) {
    if (e.old == null) return '—';
    if (e.kind === 'C' || e.kind === 'flag' || e.kind === 'bit') return String(e.old);
    if (e.kind === 'DPTR' || e.kind === 'PC') return M.hw(e.old);
    return M.hb(e.old);
  }
  /** 从访问记录里挑出"变了的"——同一处多次写只留最后一次，旧值取第一次 */
  function changes(trace) {
    var seen = {}, out = [];
    trace.log.forEach(function (e) {
      if (e.op !== 'w') return;
      var key = e.kind + ':' + e.addr;
      if (seen[key]) { seen[key].val = e.val; return; }
      var c = { kind: e.kind, addr: e.addr, val: e.val, old: e.old, role: e.role };
      seen[key] = c; out.push(c);
    });
    return out;
  }

  function runHTML(ins) {
    var r = M.runExample(ins);
    if (r.error) return '<div class="run-err">这条的示例没跑起来：' + esc(r.error) + '</div>';
    var t = r.trace, ch = changes(t), line = r.asm.lines[0];
    var cyc = t.cycles + ' 个机器周期';
    var rows = ch.length ? ch.map(function (c, i) {
      var same = c.old === c.val;
      return '<div class="run-row' + (same ? ' same' : '') + '" style="animation-delay:' + (0.12 + i * 0.09) + 's">' +
        '<span class="k">' + esc(KIND_LABEL(c)) + '</span><span class="o">' + fmtOld(c) + '</span>' +
        '<span class="ar">→</span><span class="n">' + fmtVal(c) + '</span></div>';
    }).join('') : '<div class="run-row"><span class="k">—</span><span class="o">什么都没变</span></div>';
    var jump = t.ins && /jump-|bit-jump/.test(t.ins.group)
      ? '<div class="run-jump">' + (t.jumped ? '跳了：PC 从下一条 ' + M.hw(t.next) + ' 改成 <b>' + M.hw(t.newPC) + '</b>'
                                             : '没跳：PC 顺着走到 <b>' + M.hw(t.next) + '</b>') + '</div>' : '';
    return '<div class="run">' +
      '<div class="run-hd"><code>' + esc(line.text) + '</code><span class="run-mc">' +
        line.bytes.map(hex2).join(' ') + '</span><span class="run-cy">' + cyc + '</span></div>' +
      (r.ex.note ? '<div class="run-note">' + esc(r.ex.note) + '</div>' : '') +
      '<div class="run-tb">' + rows + '</div>' + jump + '</div>';
  }

  /**
   * 在"取数现场"上逐条放映一段程序
   *   lines：汇编结果里的指令行；cpu：已装好初值和程序的引擎
   *   hooks.rows(line, probeTrace, i, lines) → { head, rows }   ROM 下半显示什么
   *   hooks.note(line, i, lines) → 字符串                          指令下方的小字
   *   hooks.after(trace, i)                                          每条放完后
   * 每条先让副本试跑一遍拿到访问记录，格子提前就位，再让原机真跑并播放路径。
   */
  function runOnFigure(fig, cpu, lines, hooks, done) {
    hooks = hooks || {};
    var i = 0, traces = [];
    (function next() {
      if (i >= lines.length) { if (done) done(traces); return; }
      var L = lines[i];
      cpu.pc = L.addr;
      var probe = cpu.clone(), tp = probe.step();
      if (hooks.rows) { var rr = hooks.rows(L, tp, i, lines); fig.setRows(rr.head, rr.rows); }
      fig.clear(); fig.resetDyn();
      fig.showInstruction(L.addr, L.bytes, L.text, hooks.note ? hooks.note(L, i, lines) : '');
      var hops = fig.hops(tp, probe);
      fig.render(cpu, false);
      var t = cpu.step(); traces.push(t);
      fig.play(hops, function () {
        fig.render(cpu, true);
        if (hooks.after) hooks.after(t, i);
        i++;
        if (i < lines.length) setTimeout(next, hooks.gap || 700); else next();
      });
    })();
  }

  /* ============================================================
     按钮在哪，效果就在哪
     ============================================================ */
  /** 把演示区（图 + 说明）挪到刚点的那一块紧下面；已经在那儿就不动。返回是否挪了 */
  function dock(panel, after, keep) {
    if (!panel || !after || panel.previousElementSibling === after) return false;
    var y0 = keep ? keep.getBoundingClientRect().top : 0;
    after.parentNode.insertBefore(panel, after.nextSibling);
    /* 刚点的那个按钮留在屏幕原位：演示区从别处挪走、页面会缩，这里把它补回来 */
    if (keep) { var dy = keep.getBoundingClientRect().top - y0; if (dy) window.scrollBy({ top: dy, left: 0, behavior: 'instant' }); }
    panel.classList.remove('docked'); void panel.offsetWidth; panel.classList.add('docked');
    return true;
  }
  /** 把讲解卡里 KP.stage 连同它后面的说明、读数、"当前在讲什么"包成一个可以挪动的演示区 */
  function demoPanel(stage) {
    var card = stage.parentNode, d = document.createElement('div');
    d.className = 'u3-dock'; card.insertBefore(d, stage);
    var el = d.nextSibling; while (el) { var n = el.nextSibling; d.appendChild(el); el = n; }
    return d;
  }
  /** 表格型的网格里，点的是哪一格，就找到这一行的最后一格（下一行从 rowSel 开始） */
  function rowEnd(cell, grid, rowSel) {
    var el = cell; while (el.parentNode !== grid) el = el.parentNode;
    while (el.nextElementSibling && !el.nextElementSibling.matches(rowSel) && !el.nextElementSibling.classList.contains('u3-dock')) el = el.nextElementSibling;
    return el;
  }
  /**
   * "自己写一段"：收起时只占一行，放在它驱动的那张图紧上方，运行结果就在眼前
   * o = { id, msgId, value, examples: [[src, label?]], run(src), sub, label, open }
   */
  function tryBox(o) {
    var box = document.createElement('div');
    box.className = 'u3-try' + (o.open ? ' open' : '');
    box.innerHTML = '<button class="u3-try-t" type="button"><b>✎ 自己写一段</b><small>' + esc(o.sub || '') + '</small><i>展开</i></button>' +
      '<div class="u3-try-b"><textarea id="' + o.id + '" spellcheck="false">' + esc(o.value || '') + '</textarea>' +
      '<div class="u3-try-r"><button class="kp-btn go" type="button" data-run="1">' + esc(o.label || '▶ 运行') + '</button><span class="eg">试试：' +
      (o.examples || []).map(function (x, i) { return '<button type="button" data-i="' + i + '">' + esc(x[1] || x[0]) + '</button>'; }).join('') + '</span></div>' +
      '<div class="msg" id="' + o.msgId + '"></div></div>';
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.classList.contains('u3-try-t')) { box.classList.toggle('open'); b.querySelector('i').textContent = box.classList.contains('open') ? '收起' : '展开'; return; }
      if (b.dataset.run) { o.run(document.getElementById(o.id).value); return; }
      if (b.dataset.i != null) { document.getElementById(o.id).value = o.examples[+b.dataset.i][0]; o.run(o.examples[+b.dataset.i][0]); }
    });
    if (o.open) box.querySelector('.u3-try-t i').textContent = '收起';
    return box;
  }

  /* ============================================================
     嵌在平台"讲解笔记"页里时（同源 iframe）
       · 页内的章节导航条收起来——平台外壳自己有页签
       · 点到别的讲解页（文件名 u2-、u3- 开头的）不在框里跳，而是请外壳切到那一篇
     单独打开时一切照旧
     ============================================================ */
  var EMBED = (function () { try { return global.self !== global.top; } catch (e) { return true; } })();
  if (EMBED && typeof document !== 'undefined') {
    document.documentElement.classList.add('u3-embed');
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]'); if (!a || a.target === '_blank') return;
      var m = /(?:^|\/)(u[23]-[a-z-]+)\.html(#.*)?$/.exec(a.getAttribute('href') || '');
      if (!m) return;
      e.preventDefault();
      try { global.parent.postMessage({ type: 'lesson-note:open', file: m[1], hash: m[2] || '' }, global.location.origin); } catch (err) { global.location.href = a.href; }
    }, true);
  }

  global.U3 = {
    embedded: EMBED,
    dock: dock, rowEnd: rowEnd, tryBox: tryBox, demoPanel: demoPanel,
    runOnFigure: runOnFigure,
    COLOR: COLOR, PAGES: PAGES, nav: nav, pageFor: pageFor,
    codeProfile: codeProfile, modeChips: modeChips, runHTML: runHTML, changes: changes,
    esc: esc, hex2: hex2, KIND_LABEL: KIND_LABEL
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<!-- 内联自 lib/u3-bitmap.js -->
<script>
/* ============================================================
   u3-bitmap.js · 位地图（211 个位地址在哪）
   ------------------------------------------------------------
   左：片内 RAM 20H~2FH 这 16 个字节，每格一位，格子里写位地址 00H~7FH。
       字节 = 20H + 位地址 ÷ 8，第几位 = 余数。
   右：可位寻址的 11 个 SFR（字节地址能被 8 整除），位地址在 80H~FFH 中。
       字节 = 位地址的高 5 位，第几位 = 低 3 位。其中 IE.5、IE.6、IP.5~IP.7 是保留位，
       所以 SFR 里能用的位是 11 × 8 − 5 = 83 个；加上 RAM 里的 128 个，一共 211 个。
   点一格就选中这一位；页面再把它的四种写法、在哪个字节第几位讲出来。
   选中的位地址若恰好也是 20H~2FH 里的一个字节地址，就用虚线把那个字节也框出来——
   同一个数，两种身份，这是最容易弄混的地方。
   依赖：mcs51.js
   ============================================================ */
(function (global) {
  'use strict';
  var M = global.MCS51;
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, at, parent) {
    var n = document.createElementNS(NS, tag);
    if (at) for (var k in at) { if (k === 'text') n.textContent = at[k]; else if (at[k] != null) n.setAttribute(k, at[k]); }
    if (parent) parent.appendChild(n);
    return n;
  }
  var W = 980, H = 470, Y0 = 70, DY = 23, CH = 20;
  var L = { x: 76, w: 36, dx: 38 }, R = { x: 560, w: 46, dx: 48 };

  /** 位地址 → { byte, n }；byte 为字节地址 */
  function home(a) { return a < 0x80 ? { byte: 0x20 + (a >> 3), n: a & 7 } : { byte: a & 0xF8, n: a & 7 }; }
  function sfrAt(byte) { for (var k in M.SFR) if (M.SFR[k] === byte) return k; return null; }
  function nameOf(a) { for (var k in M.NAMED_BITS) if (M.NAMED_BITS[k] === a) return k; return null; }
  /* 80C51 没有定义的保留位：IE.5、IE.6、IP.5、IP.6、IP.7 */
  var RESERVED = { 0xAD: 1, 0xAE: 1, 0xBD: 1, 0xBE: 1, 0xBF: 1 };

  function BitMap(host, opt) {
    this.opt = opt || {};
    host.innerHTML = '';
    var svg = this.svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'bm', role: 'img',
      'aria-label': '位地图：片内 RAM 20H~2FH 的 128 个位，和可位寻址 SFR 的 128 个位地址' }, host);
    this.gB = el('g', null, svg); this.gS = el('g', null, svg);
    this.cells = {};
    this.build();
    var self = this;
    svg.addEventListener('click', function (e) {
      var c = e.target.closest && e.target.closest('[data-b]'); if (!c) return;
      if (self.opt.onPick) self.opt.onPick(+c.getAttribute('data-b'));
    });
  }
  BitMap.prototype.build = function () {
    var B = this.gB, self = this, i, r;
    el('text', { x: 24, y: 26, class: 'bm-h', text: '片内 RAM 位寻址区 20H~2FH · 128 个（位地址 00H~7FH）' }, B);
    el('text', { x: 470, y: 26, class: 'bm-h', text: 'SFR 里的位 · 83 个（位地址在 80H~FFH 中）' }, B);
    for (i = 7; i >= 0; i--) {
      el('text', { x: L.x + (7 - i) * L.dx + L.w / 2, y: Y0 - 10, 'text-anchor': 'middle', class: 'bm-d', text: 'D' + i }, B);
      el('text', { x: R.x + (7 - i) * R.dx + R.w / 2, y: Y0 - 10, 'text-anchor': 'middle', class: 'bm-d', text: 'D' + i }, B);
    }
    this.rowL = {}; this.rowR = {};
    for (r = 0; r < 16; r++) {
      var byte = 0x20 + r, y = Y0 + r * DY;
      this.rowL[byte] = el('rect', { x: 20, y: y - 2, width: L.x + 8 * L.dx - 16, height: CH + 4, rx: 5, class: 'bm-row' }, B);
      el('text', { x: 28, y: y + 15, class: 'bm-rl', text: M.hb(byte) }, B);
      for (i = 7; i >= 0; i--) this.cell(B, (r << 3) | i, L.x + (7 - i) * L.dx, y, L.w, M.hb((r << 3) | i).replace(/H$/, ''));
    }
    for (r = 0; r < 16; r++) {
      var sb = 0x80 + r * 8, yy = Y0 + r * DY, nm = sfrAt(sb);
      this.rowR[sb] = el('rect', { x: 464, y: yy - 2, width: R.x + 8 * R.dx - 456, height: CH + 4, rx: 5, class: 'bm-row' }, B);
      el('text', { x: 472, y: yy + 15, class: 'bm-rl' + (nm ? '' : ' none'), text: nm ? nm : M.hb(sb) }, B);
      el('text', { x: 548, y: yy + 15, 'text-anchor': 'end', class: 'bm-ra', text: nm ? M.hb(sb) : '' }, B);
      if (!nm) { el('text', { x: R.x + 4, y: yy + 15, class: 'bm-none', text: '80C51 这里没有 SFR' }, B); continue; }

  sub: '装进下面的程序走位，从头单步；写错了，汇编器按教材口径指出来。建议最后写 SJMP $ 停住' }), document.getElementById('bjKeys'));

/* ============================================================
   动手验证：多组初值真跑到 SJMP $
   ============================================================ */
function runProg(src, pre) {
  var cpu = new M.CPU(); cpu.load(pre || {}); if (pre && pre.bits) Object.keys(pre.bits).forEach(function (a) { cpu.writeBit(+a, pre.bits[a]); });
  var a = cpu.program(src, 0), addrs = {};
  a.lines.forEach(function (L) { if (!L.db) addrs[L.addr] = 1; });
  for (var n = 0; n < 50000; n++) {
    if (!addrs[cpu.pc]) return { cpu: cpu, err: 'PC 跑到了 ' + hw(cpu.pc) + '，不在你的程序里——忘了写 SJMP $？' };
    var t = cpu.step();
    if (U3Flow.stuck(t)) return { cpu: cpu, n: n + 1 };
  }
  return { cpu: cpu, err: '跑了 50000 步还没停，可能是死循环' };
}
function P1bits(p) { return [0, 1, 2, 3, 4, 5, 6, 7].map(function (i) { return (p >> i) & 1; }); }
var TASKS = [
  { q: '用位指令实现 <b>P1.0 = P1.1 ∧ /P1.2</b>；P1 的其他 7 位不许动。最后写 <code>SJMP $</code>。',
    sets: [0, 1, 2, 3, 4, 5, 6, 7].map(function (v) { var p = 0xA8 | v; return { pre: { sfr: { P1: p } }, lab: 'P1.2 P1.1 P1.0 = ' + ((v >> 2) & 1) + ' ' + ((v >> 1) & 1) + ' ' + (v & 1), p: p }; }),
    check: function (c, s) {
      var b = P1bits(s.p), q = c.sfr[0x10], want = b[1] & (1 - b[2]);
      if ((q & 1) !== want) return 'P1.0 应为 ' + want + '，你得到 ' + (q & 1) + '。';
      if ((q & 0xFE) !== (s.p & 0xFE)) return 'P1 的其他位被改了：' + bits8(s.p) + ' → ' + bits8(q) + '。';
      return true;
    }, hint: 'MOV C,P1.1 / ANL C,/P1.2 / MOV P1.0,C——"/" 取反后参与，P1.2 本身不变。' },
  { q: '把标志位 <b>F0</b> 的状态送到 <b>P1.7</b>（C 原来的值不要紧）；F0 和 P1 的其他位都不许变。最后写 <code>SJMP $</code>。',
    sets: [[0, 0], [0, 1], [1, 0], [1, 1]].map(function (x) { var p = (x[1] << 7) | 0x2A; return { pre: { PSW: (x[0] << 5) | ((1 - x[0]) << 7), sfr: { P1: p } }, lab: 'F0=' + x[0] + '、P1.7 原来=' + x[1], f0: x[0], p: p }; }),
    check: function (c, s) {
      var q = c.sfr[0x10];
      if (((q >> 7) & 1) !== s.f0) return 'P1.7 应为 ' + s.f0 + '，你得到 ' + ((q >> 7) & 1) + '。';
      if ((q & 0x7F) !== (s.p & 0x7F)) return 'P1 的其他位被改了。';
      if (c.readBit(0xD5) !== s.f0) return 'F0 被改了。';
      return true;
    }, hint: '两个位之间不能直接 MOV，经 C：MOV C,F0 / MOV P1.7,C。' },
  { q: '位逻辑没有异或。实现 <b>P1.0 = P1.1 ⊕ P1.2</b>（两位不同时 P1.0=1）；P1 的其他位不许动。最后写 <code>SJMP $</code>。',
    sets: [0, 1, 2, 3, 4, 5, 6, 7].map(function (v) { var p = 0x50 | v; return { pre: { sfr: { P1: p } }, lab: 'P1.2 P1.1 P1.0 = ' + ((v >> 2) & 1) + ' ' + ((v >> 1) & 1) + ' ' + (v & 1), p: p }; }),
    check: function (c, s) {
      var b = P1bits(s.p), q = c.sfr[0x10], want = b[1] ^ b[2];
      if ((q & 1) !== want) return 'P1.0 应为 ' + want + '，你得到 ' + (q & 1) + '。';
      if ((q & 0xFE) !== (s.p & 0xFE)) return 'P1 的其他位被改了。';
      return true;
    }, hint: 'MOV C,P1.1，然后 JNB P1.2 跳过下一条，下一条是 CPL C（P1.2 为 1 时才把 C 翻过来），最后 MOV P1.0,C。' },
  { q: '数一数 A 里有几个 1，结果放进 <b>R2</b>。最后写 <code>SJMP $</code>。',
    sets: (function () { var s = []; for (var v = 0; v < 256; v++) s.push({ pre: { A: v, R: [0, 0, 0x55] }, lab: 'A=' + hb(v), v: v }); return s; })(),
    check: function (c, s) { var n = 0, t = s.v; while (t) { n += t & 1; t >>= 1; } return c.R(2) === n ? true : '应得 R2=' + n + '，你得到 ' + c.R(2) + '。'; },
    hint: 'R2 先清 0、R7 放 8 当计数；每圈 RLC A 把最高位挤进 C，JNC 跳过 INC R2；DJNZ R7 转 8 圈。也可以逐位 JNB ACC.n。' },
  { q: '位 <b>00H</b> 是"有新数据"的标志：是 1 就把 <b>R3 加 1</b> 并把标志清 0；是 0 就什么都不做。20H 单元的其他位不许动。最后写 <code>SJMP $</code>。',
    sets: [[0, 5], [1, 5], [0, 0xFF], [1, 0xFF]].map(function (x) { return { pre: { iram: { 0x20: 0xF0 | x[0] }, R: [0, 0, 0, 0x05] }, r: x[1], f: x[0], lab: '标志=' + x[0] + '、R3=' + hb(x[1]) }; }).map(function (s) { s.pre.R = [0, 0, 0, s.r]; return s; }),
    check: function (c, s) {
      var w = (s.r + s.f) & 0xFF;
      if (c.R(3) !== w) return '应得 R3=' + hb(w) + '，你得到 ' + hb(c.R(3)) + '。';
      if (c.readBit(0x00) !== 0) return '标志没清 0——查了要销账。';
      if ((c.iram[0x20] & 0xFE) !== 0xF0) return '20H 单元的其他位被改了。';
      return true;
    }, hint: 'JBC 00H,NEW 一条就把"判断"和"清 0"都做了；不是 1 就直接 SJMP 到结尾。' }
];
var taskCard = document.createElement('div');
taskCard.className = 'kp-card';
taskCard.innerHTML = '<h3>动手验证 · 所有输入组合都要成立</h3><p class="kp-note" style="margin-bottom:9px">引擎从 0000H 开始执行，走到 <code>SJMP $</code> 才判。逻辑题把所有输入组合都跑一遍，数 1 那题把 256 个数都跑一遍。</p>' +
  TASKS.map(function (t, i) {

      '<textarea class="tin" spellcheck="false"></textarea><div class="row2"><button class="kp-btn go tgo">验证</button><span class="tres"></span></div></div>';
  }).join('');
KP.panels.quiz.appendChild(taskCard);
function judge(t, src) {
  var asm = M.assemble(src, 0);
  if (!asm.ok) return { err: '第 ' + asm.errors[0].line + ' 行：' + asm.errors[0].msg };
  var L = asm.lines.filter(function (x) { return !x.db; });
  if (!L.length) return { warn: '还没写指令。' };
  if (!L.some(function (x) { return x.ins.m === 'SJMP' && x.bytes[1] === 0xFE; })) return { warn: '最后写一条 SJMP $，让程序停在那里，引擎才知道你做完了。' };
  var bad = 0, first = null;
  for (var k = 0; k < t.sets.length; k++) {
    var s = t.sets[k], r = runProg(src, s.pre), why = r.err || null;
    if (!why) { var v = t.check(r.cpu, s, L); if (v !== true) why = v; }
    if (why) { bad++; if (!first) first = s.lab + ' 时：' + why; }
  }
  return bad ? { warn: first + (bad > 1 ? '（' + t.sets.length + ' 组里有 ' + bad + ' 组不对）' : '') + ' 提示：' + t.hint } : { ok: L.length + ' 条，' + t.sets.length + ' 组初值全部通过。', L: L };
}
taskCard.addEventListener('click', function (e) {
  var b = e.target.closest('.tgo'); if (!b) return;
  var bx = b.closest('.task'), t = TASKS[+bx.dataset.i], res = bx.querySelector('.tres');
  var r = judge(t, bx.querySelector('.tin').value);
  if (r.ok) { bx.classList.add('pass'); res.innerHTML = '<span style="color:var(--emerald200)">✓ ' + r.ok + '</span>'; r.L.forEach(function (x) { mark(x.ins); }); }
  else { bx.classList.remove('pass'); res.innerHTML = r.err ? '<span style="color:var(--rose300)">' + U3.esc(r.err) + '</span>' : '<span style="color:var(--amber200)">' + r.warn + '</span>'; }
});
