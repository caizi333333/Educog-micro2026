<style>
/* ============================================================
   kp-theme.css · 知识点讲解页 · 平台同源主题
   ------------------------------------------------------------
   设计令牌直接取自 sunyancai.top 运行时（shadcn/ui + Tailwind 深色主题），
   目的是嵌进平台后看不出是外来的：
     --background 220 18% 7%     底色
     --primary    184 82% 48%    青（主色）
     --accent     42 92% 58%     琥珀（强调）
     --border     205 16% 18%
     --radius     0.5rem
   页面底纹：左上青、右上琥珀两道径向光晕
   标题渐变：linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859)
   面板写法：色/[0.08] 底 + 色/25 描边 + 6px 圆角 + 44px 触控高度
   ============================================================ */
:root{
  --bg:hsl(220 18% 7%);
  --bg-deep:#070a0d;
  --fg:hsl(190 32% 94%);
  --card:hsl(220 15% 11%);
  --popover:hsl(220 14% 13%);
  --primary:hsl(184 82% 48%);
  --secondary:hsl(210 14% 16%);
  --muted:hsl(210 12% 15%);
  --muted-fg:hsl(195 13% 62%);
  --accent:hsl(42 92% 58%);
  --destructive:hsl(0 72% 51%);
  --border:hsl(205 16% 18%);
  --ring:hsl(184 82% 48%);
  --c1:hsl(184 82% 48%);   /* 青 */
  --c2:hsl(154 62% 48%);   /* 绿 */
  --c3:hsl(42 92% 58%);    /* 金 */
  --c4:hsl(210 80% 62%);   /* 蓝 */
  --c5:hsl(348 72% 62%);   /* 品红 */
  --radius:.5rem;
  --slate100:#f1f5f9; --slate300:#cbd5e1; --slate400:#94a3b8;
  --cyan100:#cffafe; --cyan300:#67e8f9;
  --emerald200:#a7f3d0; --emerald300:#6ee7b7;
  --amber200:#fde68a; --amber300:#fcd34d;
  --rose300:#fda4af;
  /* 正文 Inter 打头，后面接中文字体；平台正文即 Inter */
  --fs:Inter,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg-deep);
  background-image:
    radial-gradient(circle at 14% 10%,rgba(22,209,223,.10),transparent 28rem),
    radial-gradient(circle at 88% 18%,rgba(246,187,49,.08),transparent 26rem);
  background-attachment:fixed;
  color:var(--slate100);font-family:var(--fs);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.kp-wrap{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.kp-fade{animation:kpFade .4s ease-out both}
@keyframes kpFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 头部 ---------- */
.kp-eyebrow{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:10px}
.kp-eyebrow b{color:var(--cyan300);font-weight:600}
h1.kp-h1{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1.25;
  background-image:linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859);
  background-clip:text;-webkit-background-clip:text;color:transparent}
@media(min-width:768px){h1.kp-h1{font-size:30px}}
.kp-lead{margin-top:12px;max-width:72ch;color:var(--slate300);font-size:15px;line-height:1.7}
.kp-lead b{color:var(--cyan100);font-weight:600}
.kp-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kp-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:6px 10px}
.kp-chip b{color:var(--cyan300);font-weight:600}

/* ---------- 标签页（沿用平台自身的 tab 写法） ---------- */
.kp-tabs{display:flex;gap:8px;margin-top:22px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:5px}
.kp-tab{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:6px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s;font-family:var(--fs)}
.kp-tab:hover{color:var(--slate100);background:rgba(255,255,255,.06)}
.kp-tab[aria-selected="true"]{color:var(--cyan100);background:rgba(103,232,249,.12);
  border-color:rgba(103,232,249,.25)}
.kp-tab .n{font-family:var(--fm);font-size:11px;opacity:.8}
.kp-panel{display:none;margin-top:18px}
.kp-panel.on{display:block;animation:kpFade .3s ease-out both}

/* ---------- 通用面板 ---------- */
.kp-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:18px 20px}
.kp-card + .kp-card{margin-top:12px}
.kp-card h2{font-size:16px;font-weight:600;letter-spacing:-.2px;margin-bottom:6px;color:var(--slate100)}
.kp-card h3{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:12px}
.kp-card p{font-size:14px;line-height:1.75;color:var(--slate300)}
.kp-card p + p{margin-top:9px}
.kp-card b{color:var(--cyan100);font-weight:600}
.kp-note{font-size:13px;color:var(--muted-fg);line-height:1.7}

/* 图舞台 */
.kp-stage{position:relative;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px;overflow:hidden}
.kp-stage svg{width:100%;height:auto;display:block}
.kp-stagecap{font-family:var(--fm);font-size:11px;color:var(--muted-fg);
  margin-top:8px;text-align:center}

/* 控件行 */
.kp-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.kp-btn{min-height:44px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border-radius:6px;padding:8px 13px;font-family:var(--fm);font-size:12px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s}
.kp-btn:hover{color:var(--slate100);border-color:rgba(255,255,255,.18)}
.kp-btn.on{color:var(--cyan100);background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.25)}
.kp-btn.go{color:var(--emerald200);background:rgba(110,231,183,.08);border-color:rgba(110,231,183,.25)}
.kp-btn.go:hover{background:rgba(110,231,183,.14)}

/* 读数格 */
.kp-reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.kp-read{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:9px 11px}
.kp-read .k{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg)}
.kp-read .v{font-family:var(--fm);font-size:15px;font-weight:600;margin-top:5px;color:var(--slate100)}
.kp-read .v.hi{color:var(--cyan300)}.kp-read .v.lo{color:var(--slate400)}
.kp-read .v.warn{color:var(--rose300)}.kp-read .v.gold{color:var(--amber300)}

/* ---------- 疑点卡 ---------- */
.kp-pit{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--c5);border-radius:0 8px 8px 0;padding:16px 18px}
.kp-pit + .kp-pit{margin-top:11px}
.kp-pit .no{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--rose300);
  text-transform:uppercase}
.kp-pit .q{font-size:15px;font-weight:600;margin-top:7px;color:var(--slate100);line-height:1.55}
.kp-pit dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline}
.kp-pit dt{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg);white-space:nowrap}
.kp-pit dd{font-size:13.5px;line-height:1.7;color:var(--slate300)}
.kp-pit dd b{color:var(--cyan100)}
.kp-pit .right{color:var(--emerald200)}
.kp-pit .right b{color:var(--emerald300)}

/* ---------- 自测 ---------- */
.kp-q{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:16px 18px}
.kp-q + .kp-q{margin-top:11px}
.kp-q .qh{display:flex;gap:10px;align-items:baseline}
.kp-q .qn{font-family:var(--fm);font-size:11px;color:var(--cyan300);flex:none}
.kp-q .qt{font-size:14.5px;font-weight:600;line-height:1.6;color:var(--slate100)}
.kp-opt{display:block;width:100%;text-align:left;cursor:pointer;margin-top:8px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:6px;
  padding:10px 13px;color:var(--slate300);font-size:13.5px;line-height:1.55;
  font-family:var(--fs);transition:.16s;min-height:44px}
.kp-opt:hover{border-color:rgba(255,255,255,.16);color:var(--slate100)}
.kp-opt.ok{background:rgba(110,231,183,.09);border-color:rgba(110,231,183,.3);color:var(--slate100)}
.kp-opt.no{background:rgba(253,164,175,.09);border-color:rgba(253,164,175,.3)}
.kp-opt.lock{pointer-events:none;opacity:.5}
.kp-opt.lock.ok,.kp-opt.lock.no{opacity:1}
.kp-exp{margin-top:11px;font-size:13px;line-height:1.72;color:var(--slate300);
  background:rgba(255,255,255,.02);border-left:3px solid var(--c2);
  border-radius:0 6px 6px 0;padding:11px 13px;display:none}
.kp-exp.show{display:block}
.kp-exp.bad{border-left-color:var(--c5)}
.kp-score{font-family:var(--fm);font-size:12px;color:var(--slate300);text-align:right;margin-top:12px}
.kp-score b{color:var(--cyan300);font-size:15px}

/* ---------- 页脚 ---------- */
.kp-foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:12px;line-height:1.8;color:var(--muted-fg)}
.kp-foot b{color:var(--slate300)}
.kp-rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kp-rel a{text-decoration:none}

/* 嵌入模式：被 iframe 装载时去掉多余留白 */
body.kp-embed .kp-wrap{padding-top:14px;padding-bottom:22px}
body.kp-embed .kp-foot{display:none}
@media(max-width:640px){
  .kp-tabs{flex-direction:column}
  .kp-wrap{padding:16px 12px 40px}
}

</style>
<!-- 内联自 lib/kp-figs.css -->
<style>

   kp-figs.css · 把已有三套图形引擎（portcell / clockreset / mcustruct）
   的配色换成平台色系，使插图与站点同源。

/* ---------- 通用 ---------- */
.pc-svg,.cr-svg,.ms-svg{width:100%;height:auto;display:block}

.cr-thick{stroke-width:3}
.pc-bus,.cr-bus{stroke:rgba(241,245,249,.55);stroke-width:3.4}

.pc-box,.cr-box,.ms-box{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.14);stroke-width:1.8}
.pc-box-logic,.cr-chip,.ms-box.ms-cpu{fill:rgba(103,232,249,.05);stroke:rgba(103,232,249,.34)}
.pc-tri,.cr-tri{fill:rgba(255,255,255,.03);stroke:rgba(203,213,225,.34);stroke-width:1.8}
.pc-tri-logic{fill:rgba(103,232,249,.05);stroke:rgba(103,232,249,.34);stroke-width:1.8}
.pc-bubble,.cr-bubble{fill:#0f1115;stroke:rgba(103,232,249,.44);stroke-width:1.8}

.pc-res-ext{stroke:rgba(252,211,77,.55);stroke-dasharray:5 4}
.cr-xtal{fill:rgba(103,232,249,.06);stroke:rgba(103,232,249,.4);stroke-width:1.8}
.pc-dot,.cr-dot{fill:rgba(203,213,225,.5)}
.pc-dot-node{fill:var(--c1);r:5}
.pc-pin{fill:rgba(103,232,249,.06);stroke:rgba(103,232,249,.4);stroke-width:2}

.pc-pivot{fill:var(--c1)}
.cr-key{stroke:var(--c3)}
.cr-grid,.ms-grp{stroke:rgba(255,255,255,.1)}
.ms-grp{fill:rgba(255,255,255,.015);stroke-width:1.4;stroke-dasharray:6 5}

.ms-bus{fill:rgba(252,211,77,.08);stroke:rgba(252,211,77,.38);stroke-width:1.8}
.ms-chip{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.14);stroke-width:1.8}
.ms-notch{fill:#070a0d;stroke:rgba(255,255,255,.14);stroke-width:1.8}
.ms-arrhead{fill:rgba(203,213,225,.34)}
.ms-pinpad{fill:rgba(203,213,225,.34)}
.ms-pinw{stroke-width:2.4}
.ms-pin{transition:opacity .25s}.ms-pin.ms-dim{opacity:.2}
.ms-pwr .ms-pinw,.ms-pwr .ms-pinpad{stroke:var(--slate400);fill:var(--slate400)}
.ms-clk .ms-pinw,.ms-clk .ms-pinpad{stroke:var(--c2);fill:var(--c2)}
.ms-ctl .ms-pinw,.ms-ctl .ms-pinpad{stroke:var(--c3);fill:var(--c3)}
.ms-io0 .ms-pinw,.ms-io0 .ms-pinpad{stroke:var(--c3);fill:var(--c3)}
.ms-io1 .ms-pinw,.ms-io1 .ms-pinpad{stroke:var(--c1);fill:var(--c1)}
.ms-io2 .ms-pinw,.ms-io2 .ms-pinpad{stroke:var(--c4);fill:var(--c4)}
.ms-io3 .ms-pinw,.ms-io3 .ms-pinpad{stroke:var(--c2);fill:var(--c2)}

/* ---------- 场效应管：导通/截止画在器件上 ---------- */
.pc-fet-gate{stroke:rgba(241,245,249,.62);stroke-width:2.6}
.pc-fet-seg{stroke:rgba(203,213,225,.34);stroke-width:2.6;transition:opacity .3s}
.pc-fet-arrow{fill:rgba(203,213,225,.34);transition:fill .3s}
.pc-fet-chan{stroke:var(--c1);stroke-width:4.2;opacity:0;transition:opacity .28s;stroke-linecap:round}
.pc-fet.pc-fet-on .pc-fet-chan{opacity:1}
.pc-fet.pc-fet-on .pc-fet-seg{opacity:0}
.pc-fet.pc-fet-on .pc-fet-arrow{fill:var(--c1)}

/* ---------- 刀开关 ---------- */
.pc-blade{stroke:var(--c1);stroke-width:3.2;stroke-linecap:round;
  transform-box:view-box;transform-origin:536px 309px;
  transition:transform .42s cubic-bezier(.34,1.3,.5,1)}

/* ---------- 钳位标记 ---------- */
.pc-clamp{opacity:0;transition:opacity .3s;pointer-events:none}
.pc-clamp.pc-show{opacity:1}
.pc-clamp-w{stroke:var(--c5);stroke-width:2.2}
.pc-t-clamp{font-size:11px;font-weight:600;fill:var(--c5)}

/* ---------- 文字 ---------- */
.pc-t,.cr-t,.ms-t{font-family:var(--fm);fill:rgba(203,213,225,.82)}
.pc-t-bus{font-size:12px;font-weight:600;letter-spacing:.24em;fill:var(--muted-fg)}
.pc-t-cap,.cr-t-cap,.cr-t-fig,.ms-t-s{font-size:11.5px;font-weight:500;fill:var(--muted-fg)}
.pc-t-pin,.cr-t-pin,.ms-t-b{font-size:13px;font-weight:600;fill:var(--slate100)}
.ms-t-b{font-size:13.5px}
.pc-t-buf{font-size:12px;font-weight:700;fill:var(--c1);letter-spacing:.04em}
.pc-t-sig,.cr-t-ref,.ms-t-row{font-size:12px;font-weight:600;fill:rgba(241,245,249,.9)}
.pc-t-sig2,.pc-t-note,.cr-t-note,.ms-t-ext{font-size:10.5px;font-weight:400;fill:var(--muted-fg)}
.pc-t-op{font-size:18px;font-weight:700;fill:var(--c1)}
.pc-t-val,.pc-t-gate,.cr-t-hl,.ms-t-bus{font-size:14px;font-weight:700;fill:var(--c3)}
.pc-t-gate{font-size:11.5px}
.ms-t-bus{font-size:12.5px;letter-spacing:.2em}
.pc-t-fet,.cr-t-fet{font-size:11.5px;font-weight:600;fill:var(--muted-fg)}

.pc-t-pinname,.cr-t-chip,.ms-t-chip{font-size:15px;font-weight:700;fill:var(--c1)}
.ms-t-chip{font-size:20px;fill:rgba(241,245,249,.75)}
.pc-t-pinval{font-size:11.5px;font-weight:600;fill:rgba(241,245,249,.9)}
.pc-t-extr{font-size:11px;font-weight:600;fill:var(--c3)}

.pc-sep{stroke:rgba(255,255,255,.12);stroke-width:1.4;stroke-dasharray:4 5}

/* ---------- 状态色 ---------- */
.pc-on,.pc-hi{fill:var(--c1)!important}
.pc-cut,.pc-lo{fill:var(--muted-fg)!important}

/* ---------- 通路流动与方向箭头 ---------- */
.pc-f,.cr-f{fill:none;stroke:var(--c1);stroke-width:3;stroke-linecap:round;

.pc-f.pc-live,.cr-f.cr-live{opacity:.95;animation:kpDash .85s linear infinite}

.pc-hit,.cr-hit,.ms-hit{fill:transparent;cursor:pointer}

.pc-ring,.cr-ring,.ms-ring{fill:none;stroke:var(--c3);stroke-width:2.2;stroke-dasharray:7 5;
  pointer-events:none;animation:kpRing 12s linear infinite}

.mm-svg{width:100%;height:auto;display:block}
.mm-band{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.14);stroke-width:1.6}
.mm-prog{fill:rgba(103,232,249,.05);stroke:rgba(103,232,249,.3)}

<script>
/* ============================================================
   kp-shell.js · 知识点讲解页 · 共用外壳
   ------------------------------------------------------------
   六个知识点页共用这一套结构，保证"每篇能独立成篇、彼此风格统一"：

     眉标（单元 · 知识点编号）
     渐变大标题
     一句话定位：这个点为什么容易错
     元信息 chip（对应大纲章节 / 教材图表 / 预计用时）
     ┌ 标签页 ────────────────────────┐
     │ 讲解  —— 可交互的图 + 分步说明      │
     │ 疑点  —— 学生最常错的地方，现象→原因→正解 │
     │ 自测  —— 2~3 题，即时给解析         │
     └───────────────────────────┘
     相关知识点 + 出处

   页面只需提供数据，外壳负责渲染与交互。
   被 iframe 嵌入时自动加 .kp-embed（收紧留白、隐去页脚）。
   ============================================================ */
(function (global) {
  'use strict';

  function h(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* 允许在文案里用 **加粗** 和 `等宽` 两种极简标记，省得到处写标签 */
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`(.+?)`/g, '<code style="font-family:var(--fm);font-size:.92em;' +
        'background:rgba(255,255,255,.05);border-radius:4px;padding:1px 5px">$1</code>');
  }

  function KP(cfg) {
    /* 被 iframe 装着就进嵌入模式 */
    try { if (global.self !== global.top) document.body.classList.add('kp-embed'); } catch (e) {
      document.body.classList.add('kp-embed');
    }
    document.title = cfg.kp + '｜' + cfg.unit;

    var wrap = h('div', { class: 'kp-wrap kp-fade' });
    document.body.appendChild(wrap);

    /* ---- 头部 ---- */
    wrap.appendChild(h('div', { class: 'kp-eyebrow' },
      esc(cfg.unitEn || 'KNOWLEDGE POINT') + ' · <b>' + esc(cfg.unit) + '</b>'));
    wrap.appendChild(h('h1', { class: 'kp-h1' }, esc(cfg.kp)));
    wrap.appendChild(h('p', { class: 'kp-lead' }, md(cfg.lead)));
    if (cfg.meta && cfg.meta.length) {
      wrap.appendChild(h('div', { class: 'kp-meta' },
        cfg.meta.map(function (m) {
          return '<span class="kp-chip">' + (m[1] ? '<b>' + esc(m[0]) + '</b>' + esc(m[1]) : esc(m[0])) + '</span>';
        }).join('')));
    }

    /* ---- 标签页 ---- */
    var TABS = [
      { k: 'teach', n: '01', t: '讲解' },
      { k: 'pit', n: '02', t: '疑点' },
      { k: 'quiz', n: '03', t: '自测' }
    ].filter(function (t) {
      return t.k === 'teach' ? !!cfg.teach : (t.k === 'pit' ? (cfg.pitfalls || []).length : (cfg.quiz || []).length);
    });

    var tabsEl = h('div', { class: 'kp-tabs', role: 'tablist' });
    var panels = {};
    TABS.forEach(function (t, i) {
      var b = h('button', {
        class: 'kp-tab', role: 'tab', 'aria-selected': i === 0 ? 'true' : 'false',
        'data-k': t.k
      }, '<span class="n">' + t.n + '</span>' + t.t);
      b.onclick = function () { select(t.k); };
      tabsEl.appendChild(b);
      var p = h('div', { class: 'kp-panel' + (i === 0 ? ' on' : ''), role: 'tabpanel' });
      panels[t.k] = p;
    });
    wrap.appendChild(tabsEl);
    TABS.forEach(function (t) { wrap.appendChild(panels[t.k]); });

    function select(k) {
      Array.prototype.forEach.call(tabsEl.children, function (b) {
        b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false');
      });
      for (var key in panels) panels[key].classList.toggle('on', key === k);
      if (k === 'teach' && cfg.onShowTeach) cfg.onShowTeach();
    }

    /* ---- 讲解 ---- */
    if (cfg.teach) {
      var tp = panels.teach;
      if (cfg.teach.intro) {
        tp.appendChild(h('div', { class: 'kp-card' }, '<p>' + md(cfg.teach.intro) + '</p>'));
      }
      var stageCard = h('div', { class: 'kp-card' });
      if (cfg.teach.title) stageCard.appendChild(h('h3', null, esc(cfg.teach.title)));
      var ctl = h('div', { class: 'kp-ctl', id: 'kpCtl' });
      stageCard.appendChild(ctl);
      var stage = h('div', { class: 'kp-stage', id: 'kpStage' });
      stageCard.appendChild(stage);
      if (cfg.teach.caption) stageCard.appendChild(h('div', { class: 'kp-stagecap' }, esc(cfg.teach.caption)));
      var reads = h('div', { class: 'kp-reads', id: 'kpReads', style: 'margin-top:12px' });
      stageCard.appendChild(reads);
      var say = h('div', { class: 'kp-card', id: 'kpSay', style: 'margin-top:12px' },
        '<h3>当前在讲什么</h3><p id="kpSayT"></p>');
      stageCard.appendChild(say);
      tp.appendChild(stageCard);
      if (cfg.teach.steps && cfg.teach.steps.length) {
        var sc = h('div', { class: 'kp-card' });
        sc.appendChild(h('h3', null, '要点顺序'));
        sc.appendChild(h('div', null, cfg.teach.steps.map(function (s, i) {
          return '<p><b>' + (i + 1) + '.</b> ' + md(s) + '</p>';
        }).join('')));
        tp.appendChild(sc);
      }
      KP.ctl = ctl; KP.stage = stage; KP.reads = reads;
      KP.say = function (t) { document.getElementById('kpSayT').innerHTML = md(t); };
    }

    /* ---- 疑点 ---- */
    if ((cfg.pitfalls || []).length) {
      var pp = panels.pit;
      pp.appendChild(h('div', { class: 'kp-card' },
        '<p class="kp-note">下面几条是这个知识点上学生最常出错的地方。' +
        '每条按「常见说法 → 为什么错 → 正确理解」拆开，可以直接拿去当课堂提问。</p>'));
      cfg.pitfalls.forEach(function (p, i) {
        var el = h('div', { class: 'kp-pit' });
        el.innerHTML =
          '<div class="no">疑点 ' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="q">' + md(p.q) + '</div>' +
          '<dl>' +
          '<dt>常见说法</dt><dd>' + md(p.say) + '</dd>' +
          '<dt>为什么错</dt><dd>' + md(p.why) + '</dd>' +
          '<dt class="right">正确理解</dt><dd class="right">' + md(p.right) + '</dd>' +
          '</dl>';
        pp.appendChild(el);
      });
    }

    /* ---- 自测 ---- */
    if ((cfg.quiz || []).length) {
      var qp = panels.quiz, right = 0, answered = 0;
      var score = h('div', { class: 'kp-score' });
      cfg.quiz.forEach(function (item, i) {
        var q = h('div', { class: 'kp-q' });
        q.appendChild(h('div', { class: 'qh' },
          '<span class="qn">Q' + (i + 1) + '</span><span class="qt">' + md(item.q) + '</span>'));
        var exp = h('div', { class: 'kp-exp' }, md(item.x));
        item.o.forEach(function (o, j) {
          var b = h('button', { class: 'kp-opt' }, 'ABCD'[j] + '．' + md(o));
          b.onclick = function () {
            Array.prototype.forEach.call(q.querySelectorAll('.kp-opt'), function (x, k) {
              x.classList.add('lock');
              if (k === item.a) x.classList.add('ok');
            });
            if (j !== item.a) b.classList.add('no'); else right++;
            answered++;
            exp.classList.add('show');
            exp.classList.toggle('bad', j !== item.a);
            score.innerHTML = '答对 <b>' + right + '</b> / ' + cfg.quiz.length +
              '　已答 ' + answered;
          };
          q.appendChild(b);
        });
        q.appendChild(exp);
        qp.appendChild(q);
      });
      score.innerHTML = '答对 <b>0</b> / ' + cfg.quiz.length + '　已答 0';
      qp.appendChild(score);
    }

    /* ---- 页脚 ---- */
    var foot = h('div', { class: 'kp-foot' });
    foot.innerHTML =
      '<b>出处</b>　' + esc(cfg.source || '') + '<br>' +
      (cfg.note ? esc(cfg.note) + '<br>' : '') +
      '<b>用法</b>　本页可独立打开，也可作为单元资源嵌入平台（自适应容器宽度）。';
    if ((cfg.related || []).length) {
      foot.appendChild(h('div', { class: 'kp-rel' },
        cfg.related.map(function (r) {
          return '<a class="kp-btn" href="' + esc(r[1]) + '">' + esc(r[0]) + ' →</a>';
        }).join('')));
    }
    wrap.appendChild(foot);

    KP.select = select;
    return KP;
  }

  /* 给讲解区加一个控制按钮组，返回一个 setter */
  KP.buttons = function (items, onPick, initial) {
    var btns = items.map(function (it) {
      var b = document.createElement('button');
      b.className = 'kp-btn';
      b.textContent = it.t;
      b.dataset.k = it.k;
      b.onclick = function () { pick(it.k); };
      KP.ctl.appendChild(b);
      return b;
    });
    function pick(k) {
      btns.forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });
      onPick(k);
    }
    pick(initial || items[0].k);
    return pick;
  };
  /* 写读数格 */
  KP.setReads = function (list) {
    KP.reads.innerHTML = list.map(function (r) {
      return '<div class="kp-read"><div class="k">' + esc(r[0]) + '</div>' +
        '<div class="v ' + (r[2] || '') + '">' + esc(r[1]) + '</div></div>';
    }).join('');
  };
  KP.md = md;
  global.KP = KP;
})(window);

</script>

<script>
/* ============================================================
   clockreset.js  ·  80C51 时钟电路 / 复位电路 / 时序 / 最小应用系统
   ------------------------------------------------------------
   对照教材：韩兴国《微控制器原理及接口控制技术》
     2.5.1 时钟电路      图 2-9(a) 内部方式、图 2-9(b) 外部方式
     2.5.2 复位状态和复位电路  图 2-10(a) 加电自动复位、图 2-10(b) 按键复位
                          表 2-7 特殊功能寄存器复位之后内容状态表
   配套课件 S91–S109。
   ============================================================ */
(function (global) {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(n);
    return n;
  }
  function poly(pts) {
    return 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
  }

  /* 公共零件 ------------------------------------------------ */
  function ground(g, x, y) {
    el('path', {
      d: 'M' + (x - 17) + ',' + y + ' H' + (x + 17) +
         ' M' + (x - 10) + ',' + (y + 8) + ' H' + (x + 10) +
         ' M' + (x - 4) + ',' + (y + 16) + ' H' + (x + 4), class: 'cr-w'
    }, g);
  }
  function vcc(g, x, y, label) {
    el('path', { d: 'M' + (x - 15) + ',' + y + ' H' + (x + 15), class: 'cr-w' }, g);
    el('text', { x: x, y: y - 9, class: 'cr-t cr-t-cap', 'text-anchor': 'middle', text: label || '+5V' }, g);
  }
  /* 电容：两条平行板 */
  function cap(g, x, y, vertical) {
    if (vertical) {
      el('path', { d: 'M' + (x - 15) + ',' + (y - 4) + ' H' + (x + 15), class: 'cr-w cr-thick' }, g);
      el('path', { d: 'M' + (x - 15) + ',' + (y + 4) + ' H' + (x + 15), class: 'cr-w cr-thick' }, g);
    } else {
      el('path', { d: 'M' + (x - 4) + ',' + (y - 15) + ' V' + (y + 15), class: 'cr-w cr-thick' }, g);
      el('path', { d: 'M' + (x + 4) + ',' + (y - 15) + ' V' + (y + 15), class: 'cr-w cr-thick' }, g);
    }
  }
  /* 电阻：IEC 方框 */
  function res(g, x, y, vertical) {
    if (vertical) el('rect', { x: x - 11, y: y - 24, width: 22, height: 48, rx: 2, class: 'cr-res' }, g);
    else el('rect', { x: x - 24, y: y - 11, width: 48, height: 22, rx: 2, class: 'cr-res' }, g);
  }
  /* 石英晶体：两块板 + 中间矩形 */
  function xtal(g, x, y) {
    el('path', { d: 'M' + (x - 11) + ',' + (y - 20) + ' V' + (y + 20), class: 'cr-w cr-thick' }, g);
    el('path', { d: 'M' + (x + 11) + ',' + (y - 20) + ' V' + (y + 20), class: 'cr-w cr-thick' }, g);
    el('rect', { x: x - 6, y: y - 14, width: 12, height: 28, class: 'cr-xtal' }, g);
  }
  /* 反相器三角 + 圈 */
  function inv(g, x, y, dir) {
    var d = dir || 1;
    el('path', {
      d: 'M' + (x - 16 * d) + ',' + (y - 16) + ' L' + (x - 16 * d) + ',' + (y + 16) +
         ' L' + (x + 14 * d) + ',' + y + ' Z', class: 'cr-tri'
    }, g);
    el('circle', { cx: x + 20 * d, cy: y, r: 5, class: 'cr-bubble' }, g);
  }

  /* 通用外壳：建 svg + 图层 + 热区 */
  function shell(host, w, h) {
    host.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, class: 'cr-svg', preserveAspectRatio: 'xMidYMid meet' }, host);
    var defs = el('defs', null, svg);
    var f = el('filter', { id: 'crGlow' + (shell.n = (shell.n || 0) + 1), x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
    el('feGaussianBlur', { stdDeviation: '3', result: 'b' }, f);
    var m = el('feMerge', null, f);
    el('feMergeNode', { in: 'b' }, m); el('feMergeNode', { in: 'SourceGraphic' }, m);
    var L = {};
    ['wire', 'flow', 'body', 'label', 'hit'].forEach(function (n) { L[n] = el('g', { class: 'cr-l-' + n }, svg); });
    var reg = { svg: svg, L: L, parts: {}, txt: {}, glow: 'crGlow' + shell.n };
    reg.ring = el('rect', { x: 0, y: 0, width: 0, height: 0, rx: 9, class: 'cr-ring' }, L.hit);
    reg.part = function (name, node) {
      (reg.parts[name] = reg.parts[name] || []).push(node);
      node.classList.add('cr-part'); return node;
    };
    reg.show = function (names) {
      Object.keys(reg.parts).forEach(function (k) {
        var on = names.indexOf(k) >= 0;
        reg.parts[k].forEach(function (n) { n.classList.toggle('cr-off', !on); });
      });
    };
    reg.hit = function (name, x, y, w2, h2, key) {
      var r = el('rect', { x: x, y: y, width: w2, height: h2, class: 'cr-hit', 'data-ex': key }, L.hit);
      if (name) reg.part(name, r);
      return r;
    };
    reg.focus = function (key, EX) {
      var h2 = key && svg.querySelector('.cr-hit[data-ex="' + key + '"]:not(.cr-off)');
      if (!h2) { reg.ring.setAttribute('width', 0); return null; }
      reg.ring.setAttribute('x', +h2.getAttribute('x') - 5);
      reg.ring.setAttribute('y', +h2.getAttribute('y') - 5);
      reg.ring.setAttribute('width', +h2.getAttribute('width') + 10);
      reg.ring.setAttribute('height', +h2.getAttribute('height') + 10);
      return EX[key] || null;
    };
    return reg;
  }

  /* ============================================================
     一、时钟电路（教材图 2-9）
     ============================================================ */
  var CLOCK_EX = {
    xtal: ['石英晶体（晶振）', '并联谐振回路的核心。振荡频率可在 1.2 ~ 12 MHz 之间选择（部分高速芯片可达 40 MHz）。它接在 XTAL1 与 XTAL2 之间，与片内的反相放大器一起构成自激振荡器。频率一旦选定，机器周期也就定死了。'],
    caps: ['微调电容 C1、C2', '与晶振组成并联谐振回路，容值通常在 5 ~ 30 pF 之间选择。改变容值可以对振荡频率起微调作用，但调不动量级——量级由晶振本身决定。'],
    amp: ['片内高增益反相放大器', '芯片内部自带，输入端是 XTAL1，输出端是 XTAL2。它与外接的晶振和电容一起构成振荡电路，产生单片机工作所必需的时钟信号。'],
    x1: ['XTAL1 引脚（19 脚）', '内部反相放大器的输入端。内部方式时接晶振一端；外部方式时按教材图 2-9(b) 接地。'],
    x2: ['XTAL2 引脚（18 脚）', '内部反相放大器的输出端。内部方式时接晶振另一端；外部方式时接外部振荡器的输出。'],
    ext: ['外部振荡器', '直接提供现成的时钟。教材：对外部振荡信号无特殊要求，只要求保证脉冲宽度，一般采用频率低于 12 MHz 的方波信号。常用于多片单片机同时工作的场合，便于各片同步。'],
    div: ['片内二分频', '片内时钟发生器把振荡频率二分频，产生两相时钟 P1 和 P2。P1 在每个状态 Si 的前半部分有效，P2 在后半部分有效——这就是"一个状态周期 = 两个振荡周期"的由来。']
  };

  function ClockFig(host) {
    var W = 780, H = 470;
    var reg = shell(host, W, H);
    var L = reg.L, P = reg.part;
    this.reg = reg;

    /* 芯片框 */
    var CX = 500, CY = 86, CW = 220, CH = 230;
    el('rect', { x: CX, y: CY, width: CW, height: CH, rx: 5, class: 'cr-chip' }, L.body);
    el('text', { x: CX + CW / 2, y: CY + 26, class: 'cr-t cr-t-chip', 'text-anchor': 'middle', text: '80C51' }, L.label);

    var X1Y = 150, X2Y = 262;
    el('path', { d: 'M' + CX + ',' + X1Y + ' H' + (CX - 46), class: 'cr-w' }, L.wire);
    el('path', { d: 'M' + CX + ',' + X2Y + ' H' + (CX - 46), class: 'cr-w' }, L.wire);
    el('text', { x: CX + 14, y: X1Y + 5, class: 'cr-t cr-t-pin', 'text-anchor': 'start', text: 'XTAL1' }, L.label);
    el('text', { x: CX + 14, y: X2Y + 5, class: 'cr-t cr-t-pin', 'text-anchor': 'start', text: 'XTAL2' }, L.label);

    /* 片内反相放大器（两种方式都画，说明时钟最终进的是同一个地方） */
    el('path', { d: 'M' + (CX + 78) + ',' + X1Y + ' H' + (CX + 104), class: 'cr-w' }, L.wire);
    inv(L.body, CX + 124, X1Y, 1);
    el('path', { d: 'M' + (CX + 149) + ',' + X1Y + ' H' + (CX + 176) + ' V' + X2Y + ' H' + (CX + 78), class: 'cr-w' }, L.wire);
    el('text', { x: CX + 124, y: X1Y + 38, class: 'cr-t cr-t-note', 'text-anchor': 'middle', text: '片内高增益反相放大器' }, L.label);

    /* ---- 内部方式：晶振 + 两只电容 ---- */
    var BX = 300;
    P('int', el('path', { d: poly([[CX - 46, X1Y], [BX, X1Y], [BX, 186]]), class: 'cr-w' }, L.wire));
    P('int', el('path', { d: poly([[CX - 46, X2Y], [BX, X2Y], [BX, 226]]), class: 'cr-w' }, L.wire));
    P('int', (function () { var g = el('g', null, L.body); xtal(g, BX, 206); return g; })());
    // C1：XTAL1 支路到地
    P('int', el('path', { d: poly([[BX, X1Y], [200, X1Y], [200, 176]]), class: 'cr-w' }, L.wire));

  /* ============================================================
     二、时序四层（振荡 / 状态 / 机器 / 指令周期）

  function TimingFig(host) {
    var W = 900, H = 330;
    var reg = shell(host, W, H);
    var L = reg.L;
    this.reg = reg;

    var X0 = 120, X1 = 860, span = X1 - X0;
    var rows = [
      { y: 60, label: '振荡周期', sub: 'Tosc = 1/fosc' },
      { y: 128, label: '状态周期', sub: 'S = 2 个振荡周期' },
      { y: 196, label: '机器周期', sub: '= 12 个振荡周期' },
      { y: 264, label: '指令周期', sub: '= 1 ~ 4 个机器周期' }
    ];
    rows.forEach(function (r) {
      el('text', { x: X0 - 16, y: r.y + 4, class: 'cr-t cr-t-row', 'text-anchor': 'end', text: r.label }, L.label);
      el('text', { x: X0 - 16, y: r.y + 21, class: 'cr-t cr-t-note', 'text-anchor': 'end', text: r.sub }, L.label);
    });

    /* 第 1 行：12 个振荡周期（方波） */
    var d = 'M' + X0 + ',' + (rows[0].y + 14);
    for (var i = 0; i < 12; i++) {
      var x = X0 + span * i / 12, w = span / 12;
      d += ' H' + (x + w / 2) + ' V' + (rows[0].y - 14) + ' H' + (x + w) + ' V' + (rows[0].y + 14);
    }
    el('path', { d: d, class: 'cr-wave' }, L.body);
    for (i = 0; i < 12; i++) {
      el('line', {
        x1: X0 + span * i / 12, y1: rows[0].y - 20, x2: X0 + span * i / 12, y2: rows[3].y + 22, class: 'cr-grid'
      }, L.wire);
    }
    el('line', { x1: X1, y1: rows[0].y - 20, x2: X1, y2: rows[3].y + 22, class: 'cr-grid' }, L.wire);

    /* 第 2 行：6 个状态，每个分 P1 / P2 */
    for (i = 0; i < 6; i++) {
      var sx = X0 + span * i / 6, sw = span / 6;
      el('rect', { x: sx + 2, y: rows[1].y - 16, width: sw - 4, height: 32, rx: 3, class: 'cr-cell cr-cell-s' }, L.body);
      el('line', { x1: sx + sw / 2, y1: rows[1].y - 16, x2: sx + sw / 2, y2: rows[1].y + 16, class: 'cr-grid' }, L.wire);
      el('text', { x: sx + sw / 4, y: rows[1].y + 5, class: 'cr-t cr-t-cell', 'text-anchor': 'middle', text: 'P1' }, L.label);
      el('text', { x: sx + sw * 3 / 4, y: rows[1].y + 5, class: 'cr-t cr-t-cell', 'text-anchor': 'middle', text: 'P2' }, L.label);
      el('text', { x: sx + sw / 2, y: rows[1].y - 24, class: 'cr-t cr-t-note', 'text-anchor': 'middle', text: 'S' + (i + 1) }, L.label);
    }

    /* 第 3 行：一个机器周期 */
    el('rect', { x: X0 + 2, y: rows[2].y - 16, width: span - 4, height: 32, rx: 3, class: 'cr-cell cr-cell-m' }, L.body);
    el('text', { x: (X0 + X1) / 2, y: rows[2].y + 5, class: 'cr-t cr-t-cell', 'text-anchor': 'middle', text: '1 个机器周期 = 6 个状态 = 12 个振荡周期' }, L.label);

    /* 第 4 行：1 ~ 4 个机器周期 */
    for (i = 0; i < 4; i++) {
      var ix = X0 + span * i / 4;
      el('rect', {
        x: ix + 2, y: rows[3].y - 16, width: span / 4 - 4, height: 32, rx: 3,
        class: 'cr-cell cr-cell-i' + (i === 0 ? ' cr-cell-on' : '')
      }, L.body);
      el('text', { x: ix + span / 8, y: rows[3].y + 5, class: 'cr-t cr-t-cell', 'text-anchor': 'middle', text: (i + 1) }, L.label);
    }
    el('text', { x: X1, y: rows[3].y + 34, class: 'cr-t cr-t-note', 'text-anchor': 'end',
      text: '单周期指令占 1 格，乘除法指令占 4 格' }, L.label);

    /* 右上角实时数值 */
    reg.txt.fosc = el('text', { x: X1, y: 26, class: 'cr-t cr-t-big', 'text-anchor': 'end', text: '' }, L.label);
    this.setFreq(12);
  }
  /* 把周期换算成好读的单位 */
  function fmt(us) {
    if (us >= 1) return (Math.round(us * 1000) / 1000) + ' µs';
    return (Math.round(us * 1e6) / 1e3) + ' ns';

  TimingFig.prototype.setFreq = function (mhz) {

      osc: fmt(tosc), state: fmt(2 * tosc), machine: fmt(12 * tosc),

  var MIN_EX = {

  function MinSysFig(host) {

    P('a31', el('rect', { x: RX, y: RY2, width: RW, height: RH, rx: 5, class: 'cr-box' }, L.body));
    P('a31', el('text', { x: RX + RW / 2, y: RY2 + 44, class: 'cr-t cr-t-ref', 'text-anchor': 'middle', text: '外部' }, L.label));
    P('a31', el('text', { x: RX + RW / 2, y: RY2 + 66, class: 'cr-t cr-t-ref', 'text-anchor': 'middle', text: 'ROM' }, L.label));
    P('a31', el('text', { x: RX + RW / 2, y: RY2 + 92, class: 'cr-t cr-t-note', 'text-anchor': 'middle', text: '程序存储器' }, L.label));

    // P0 → 373（低 8 位地址）
    P('a31', el('path', { d: poly([[CX + CW, CY + 176], [600, CY + 176], [600, LY + 30], [LX, LY + 30]]), class: 'cr-w cr-bus' }, L.wire));
    P('a31', el('text', { x: CX + CW + 10, y: CY + 168, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'P0　低 8 位地址 / 数据' }, L.label));
    // ALE → 373
    P('a31', el('path', { d: poly([[CX + CW, CY + 40], [590, CY + 40], [590, LY + 74], [LX, LY + 74]]), class: 'cr-w' }, L.wire));
    P('a31', el('text', { x: CX + CW + 10, y: CY + 32, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'ALE　锁存允许' }, L.label));
    // 373 → ROM 低地址
    P('a31', el('path', { d: poly([[LX + LW, LY + 50], [RX + 20, LY + 50], [RX + 20, RY2]]), class: 'cr-w cr-bus' }, L.wire));
    P('a31', el('text', { x: LX + LW + 12, y: LY + 42, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'A7 ~ A0' }, L.label));
    // P2 → ROM 高地址
    P('a31', el('path', { d: poly([[CX + CW, CY + 236], [620, CY + 236], [620, RY2 + 40], [RX, RY2 + 40]]), class: 'cr-w cr-bus' }, L.wire));
    P('a31', el('text', { x: CX + CW + 10, y: CY + 228, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'P2　高 8 位地址 A15 ~ A8' }, L.label));
    // P0 → ROM 数据
    P('a31', el('path', { d: poly([[600, CY + 176], [600, RY2 + 90], [RX, RY2 + 90]]), class: 'cr-w cr-bus' }, L.wire));
    P('a31', el('text', { x: 712, y: RY2 + 74, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'D7 ~ D0' }, L.label));
    // PSEN → ROM
    P('a31', el('path', { d: poly([[CX + CW, CY + 266], [660, CY + 266], [660, RY2 + 128], [RX, RY2 + 128]]), class: 'cr-w' }, L.wire));
    P('a31', el('text', { x: CX + CW + 10, y: CY + 258, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: 'PSEN　取指选通' }, L.label));
    // 剩下能用的口
    P('a31', el('text', { x: 640, y: 466, class: 'cr-t cr-t-hl', 'text-anchor': 'start', text: 'P0、P2 被总线占用' }, L.label));
    P('a31', el('text', { x: 640, y: 486, class: 'cr-t cr-t-note', 'text-anchor': 'start', text: '真正留给用户的只有 P1 和 P3 的一部分' }, L.label));
    reg.hit('a31', LX - 6, LY - 6, LW + 12, LH + 12, 'latch');
    reg.hit('a31', RX - 6, RY2 - 6, RW + 12, RH + 12, 'rom');
    reg.hit('a31', CX + CW + 6, CY + 22, 130, 34, 'ale');
    reg.hit('a31', CX + CW + 6, CY + 248, 140, 34, 'psen');
    reg.hit('a31', 634, 448, 290, 46, 'busy');

    this.chip = '8051';
    this.setChip('8051');
  }
  MinSysFig.prototype.setChip = function (c) {

    }else{
      KP.say('**8031 最小系统**　片内无 ROM，**EA 必须接地**。P0 送低 8 位地址经 ALE 锁进 74LS373，随后掉头传数据；P2 送高 8 位地址；PSEN 选通取指。代价是 **P0、P2 被总线占用**。');
      KP.setReads([['EA','接地','gold'],['外部锁存器','74LS373','hi'],
                   ['可用 I/O','仅 P1 + P3 余下几条','gold'],['选通','ALE · PSEN','hi']]);
    }
  },'8051');
  host.addEventListener('click',function(e){
    var h=e.target.closest?e.target.closest('.cr-hit'):null;
    if(!h){ sys.focus(null); return; }
    var i=sys.focus(h.getAttribute('data-ex'));
    if(i) KP.say('**'+i[0]+'**　'+i[1]);
  });
})();
</script>
