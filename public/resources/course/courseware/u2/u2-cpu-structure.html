<style>
/* ============================================================
   kp-theme.css · 知识点讲解页 · 平台同源主题
   ------------------------------------------------------------
   设计令牌直接取自 sunyancai.top 运行时（shadcn/ui + Tailwind 深色主题），
   目的是嵌进平台后看不出是外来的：
     --background 220 18% 7%     底色
     --primary    184 82% 48%    青（主色）
     --accent     42 92% 58%     琥珀（强调）
     --border     205 16% 18%
     --radius     0.5rem
   页面底纹：左上青、右上琥珀两道径向光晕
   标题渐变：linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859)
   面板写法：色/[0.08] 底 + 色/25 描边 + 6px 圆角 + 44px 触控高度
   ============================================================ */
:root{
  --bg:hsl(220 18% 7%);
  --bg-deep:#070a0d;
  --fg:hsl(190 32% 94%);
  --card:hsl(220 15% 11%);
  --popover:hsl(220 14% 13%);
  --primary:hsl(184 82% 48%);
  --secondary:hsl(210 14% 16%);
  --muted:hsl(210 12% 15%);
  --muted-fg:hsl(195 13% 62%);
  --accent:hsl(42 92% 58%);
  --destructive:hsl(0 72% 51%);
  --border:hsl(205 16% 18%);
  --ring:hsl(184 82% 48%);
  --c1:hsl(184 82% 48%);   /* 青 */
  --c2:hsl(154 62% 48%);   /* 绿 */
  --c3:hsl(42 92% 58%);    /* 金 */
  --c4:hsl(210 80% 62%);   /* 蓝 */
  --c5:hsl(348 72% 62%);   /* 品红 */
  --radius:.5rem;
  --slate100:#f1f5f9; --slate300:#cbd5e1; --slate400:#94a3b8;
  --cyan100:#cffafe; --cyan300:#67e8f9;
  --emerald200:#a7f3d0; --emerald300:#6ee7b7;
  --amber200:#fde68a; --amber300:#fcd34d;
  --rose300:#fda4af;
  /* 正文 Inter 打头，后面接中文字体；平台正文即 Inter */
  --fs:Inter,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg-deep);
  background-image:
    radial-gradient(circle at 14% 10%,rgba(22,209,223,.10),transparent 28rem),
    radial-gradient(circle at 88% 18%,rgba(246,187,49,.08),transparent 26rem);
  background-attachment:fixed;
  color:var(--slate100);font-family:var(--fs);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.kp-wrap{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
.kp-fade{animation:kpFade .4s ease-out both}
@keyframes kpFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 头部 ---------- */
.kp-eyebrow{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:10px}
.kp-eyebrow b{color:var(--cyan300);font-weight:600}
h1.kp-h1{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1.25;
  background-image:linear-gradient(135deg,#4fe3ee,#51d69d 48%,#f8c859);
  background-clip:text;-webkit-background-clip:text;color:transparent}
@media(min-width:768px){h1.kp-h1{font-size:30px}}
.kp-lead{margin-top:12px;max-width:72ch;color:var(--slate300);font-size:15px;line-height:1.7}
.kp-lead b{color:var(--cyan100);font-weight:600}
.kp-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.kp-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:6px 10px}
.kp-chip b{color:var(--cyan300);font-weight:600}

/* ---------- 标签页（沿用平台自身的 tab 写法） ---------- */
.kp-tabs{display:flex;gap:8px;margin-top:22px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:5px}
.kp-tab{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:6px;padding:0 12px;font-size:14px;font-weight:500;cursor:pointer;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s;font-family:var(--fs)}
.kp-tab:hover{color:var(--slate100);background:rgba(255,255,255,.06)}
.kp-tab[aria-selected="true"]{color:var(--cyan100);background:rgba(103,232,249,.12);
  border-color:rgba(103,232,249,.25)}
.kp-tab .n{font-family:var(--fm);font-size:11px;opacity:.8}
.kp-panel{display:none;margin-top:18px}
.kp-panel.on{display:block;animation:kpFade .3s ease-out both}

/* ---------- 通用面板 ---------- */
.kp-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:18px 20px}
.kp-card + .kp-card{margin-top:12px}
.kp-card h2{font-size:16px;font-weight:600;letter-spacing:-.2px;margin-bottom:6px;color:var(--slate100)}
.kp-card h3{font-family:var(--fm);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--muted-fg);text-transform:uppercase;margin-bottom:12px}
.kp-card p{font-size:14px;line-height:1.75;color:var(--slate300)}
.kp-card p + p{margin-top:9px}
.kp-card b{color:var(--cyan100);font-weight:600}
.kp-note{font-size:13px;color:var(--muted-fg);line-height:1.7}

/* 图舞台 */
.kp-stage{position:relative;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px;overflow:hidden}
.kp-stage svg{width:100%;height:auto;display:block}
.kp-stagecap{font-family:var(--fm);font-size:11px;color:var(--muted-fg);
  margin-top:8px;text-align:center}

/* 控件行 */
.kp-ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.kp-btn{min-height:44px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border-radius:6px;padding:8px 13px;font-family:var(--fm);font-size:12px;
  color:var(--slate300);background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);transition:.18s}
.kp-btn:hover{color:var(--slate100);border-color:rgba(255,255,255,.18)}
.kp-btn.on{color:var(--cyan100);background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.25)}
.kp-btn.go{color:var(--emerald200);background:rgba(110,231,183,.08);border-color:rgba(110,231,183,.25)}
.kp-btn.go:hover{background:rgba(110,231,183,.14)}

/* 读数格 */
.kp-reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.kp-read{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:9px 11px}
.kp-read .k{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg)}
.kp-read .v{font-family:var(--fm);font-size:15px;font-weight:600;margin-top:5px;color:var(--slate100)}
.kp-read .v.hi{color:var(--cyan300)}.kp-read .v.lo{color:var(--slate400)}
.kp-read .v.warn{color:var(--rose300)}.kp-read .v.gold{color:var(--amber300)}

/* ---------- 疑点卡 ---------- */
.kp-pit{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-left:3px solid var(--c5);border-radius:0 8px 8px 0;padding:16px 18px}
.kp-pit + .kp-pit{margin-top:11px}
.kp-pit .no{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--rose300);
  text-transform:uppercase}
.kp-pit .q{font-size:15px;font-weight:600;margin-top:7px;color:var(--slate100);line-height:1.55}
.kp-pit dl{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline}
.kp-pit dt{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:var(--muted-fg);white-space:nowrap}
.kp-pit dd{font-size:13.5px;line-height:1.7;color:var(--slate300)}
.kp-pit dd b{color:var(--cyan100)}
.kp-pit .right{color:var(--emerald200)}
.kp-pit .right b{color:var(--emerald300)}

/* ---------- 自测 ---------- */
.kp-q{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:16px 18px}
.kp-q + .kp-q{margin-top:11px}
.kp-q .qh{display:flex;gap:10px;align-items:baseline}
.kp-q .qn{font-family:var(--fm);font-size:11px;color:var(--cyan300);flex:none}
.kp-q .qt{font-size:14.5px;font-weight:600;line-height:1.6;color:var(--slate100)}
.kp-opt{display:block;width:100%;text-align:left;cursor:pointer;margin-top:8px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:6px;
  padding:10px 13px;color:var(--slate300);font-size:13.5px;line-height:1.55;
  font-family:var(--fs);transition:.16s;min-height:44px}
.kp-opt:hover{border-color:rgba(255,255,255,.16);color:var(--slate100)}
.kp-opt.ok{background:rgba(110,231,183,.09);border-color:rgba(110,231,183,.3);color:var(--slate100)}
.kp-opt.no{background:rgba(253,164,175,.09);border-color:rgba(253,164,175,.3)}
.kp-opt.lock{pointer-events:none;opacity:.5}
.kp-opt.lock.ok,.kp-opt.lock.no{opacity:1}
.kp-exp{margin-top:11px;font-size:13px;line-height:1.72;color:var(--slate300);
  background:rgba(255,255,255,.02);border-left:3px solid var(--c2);
  border-radius:0 6px 6px 0;padding:11px 13px;display:none}
.kp-exp.show{display:block}
.kp-exp.bad{border-left-color:var(--c5)}
.kp-score{font-family:var(--fm);font-size:12px;color:var(--slate300);text-align:right;margin-top:12px}
.kp-score b{color:var(--cyan300);font-size:15px}

/* ---------- 页脚 ---------- */
.kp-foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:12px;line-height:1.8;color:var(--muted-fg)}
.kp-foot b{color:var(--slate300)}
.kp-rel{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kp-rel a{text-decoration:none}

/* 嵌入模式：被 iframe 装载时去掉多余留白 */
body.kp-embed .kp-wrap{padding-top:14px;padding-bottom:22px}
body.kp-embed .kp-foot{display:none}
@media(max-width:640px){
  .kp-tabs{flex-direction:column}
  .kp-wrap{padding:16px 12px 40px}
}

</style>

<!-- 内联自 lib/kp-shell.js -->
<script>
/* ============================================================
   kp-shell.js · 知识点讲解页 · 共用外壳
   ------------------------------------------------------------
   六个知识点页共用这一套结构，保证"每篇能独立成篇、彼此风格统一"：

     眉标（单元 · 知识点编号）
     渐变大标题
     一句话定位：这个点为什么容易错
     元信息 chip（对应大纲章节 / 教材图表 / 预计用时）
     ┌ 标签页 ────────────────────────┐
     │ 讲解  —— 可交互的图 + 分步说明      │
     │ 疑点  —— 学生最常错的地方，现象→原因→正解 │
     │ 自测  —— 2~3 题，即时给解析         │
     └───────────────────────────┘
     相关知识点 + 出处

   页面只需提供数据，外壳负责渲染与交互。
   被 iframe 嵌入时自动加 .kp-embed（收紧留白、隐去页脚）。
   ============================================================ */
(function (global) {
  'use strict';

  function h(tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* 允许在文案里用 **加粗** 和 `等宽` 两种极简标记，省得到处写标签 */
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`(.+?)`/g, '<code style="font-family:var(--fm);font-size:.92em;' +
        'background:rgba(255,255,255,.05);border-radius:4px;padding:1px 5px">$1</code>');
  }

  function KP(cfg) {
    /* 被 iframe 装着就进嵌入模式 */
    try { if (global.self !== global.top) document.body.classList.add('kp-embed'); } catch (e) {
      document.body.classList.add('kp-embed');
    }
    document.title = cfg.kp + '｜' + cfg.unit;

    var wrap = h('div', { class: 'kp-wrap kp-fade' });
    document.body.appendChild(wrap);

    /* ---- 头部 ---- */
    wrap.appendChild(h('div', { class: 'kp-eyebrow' },
      esc(cfg.unitEn || 'KNOWLEDGE POINT') + ' · <b>' + esc(cfg.unit) + '</b>'));
    wrap.appendChild(h('h1', { class: 'kp-h1' }, esc(cfg.kp)));
    wrap.appendChild(h('p', { class: 'kp-lead' }, md(cfg.lead)));
    if (cfg.meta && cfg.meta.length) {
      wrap.appendChild(h('div', { class: 'kp-meta' },
        cfg.meta.map(function (m) {
          return '<span class="kp-chip">' + (m[1] ? '<b>' + esc(m[0]) + '</b>' + esc(m[1]) : esc(m[0])) + '</span>';
        }).join('')));
    }

    /* ---- 标签页 ---- */
    var TABS = [
      { k: 'teach', n: '01', t: '讲解' },
      { k: 'pit', n: '02', t: '疑点' },
      { k: 'quiz', n: '03', t: '自测' }
    ].filter(function (t) {
      return t.k === 'teach' ? !!cfg.teach : (t.k === 'pit' ? (cfg.pitfalls || []).length : (cfg.quiz || []).length);
    });

    var tabsEl = h('div', { class: 'kp-tabs', role: 'tablist' });
    var panels = {};
    TABS.forEach(function (t, i) {
      var b = h('button', {
        class: 'kp-tab', role: 'tab', 'aria-selected': i === 0 ? 'true' : 'false',
        'data-k': t.k
      }, '<span class="n">' + t.n + '</span>' + t.t);
      b.onclick = function () { select(t.k); };
      tabsEl.appendChild(b);
      var p = h('div', { class: 'kp-panel' + (i === 0 ? ' on' : ''), role: 'tabpanel' });
      panels[t.k] = p;
    });
    wrap.appendChild(tabsEl);
    TABS.forEach(function (t) { wrap.appendChild(panels[t.k]); });

    function select(k) {
      Array.prototype.forEach.call(tabsEl.children, function (b) {
        b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false');
      });
      for (var key in panels) panels[key].classList.toggle('on', key === k);
      if (k === 'teach' && cfg.onShowTeach) cfg.onShowTeach();
    }

    /* ---- 讲解 ---- */
    if (cfg.teach) {
      var tp = panels.teach;
      if (cfg.teach.intro) {
        tp.appendChild(h('div', { class: 'kp-card' }, '<p>' + md(cfg.teach.intro) + '</p>'));
      }
      var stageCard = h('div', { class: 'kp-card' });
      if (cfg.teach.title) stageCard.appendChild(h('h3', null, esc(cfg.teach.title)));
      var ctl = h('div', { class: 'kp-ctl', id: 'kpCtl' });
      stageCard.appendChild(ctl);
      var stage = h('div', { class: 'kp-stage', id: 'kpStage' });
      stageCard.appendChild(stage);
      if (cfg.teach.caption) stageCard.appendChild(h('div', { class: 'kp-stagecap' }, esc(cfg.teach.caption)));
      var reads = h('div', { class: 'kp-reads', id: 'kpReads', style: 'margin-top:12px' });
      stageCard.appendChild(reads);
      var say = h('div', { class: 'kp-card', id: 'kpSay', style: 'margin-top:12px' },
        '<h3>当前在讲什么</h3><p id="kpSayT"></p>');
      stageCard.appendChild(say);
      tp.appendChild(stageCard);
      if (cfg.teach.steps && cfg.teach.steps.length) {
        var sc = h('div', { class: 'kp-card' });
        sc.appendChild(h('h3', null, '要点顺序'));
        sc.appendChild(h('div', null, cfg.teach.steps.map(function (s, i) {
          return '<p><b>' + (i + 1) + '.</b> ' + md(s) + '</p>';
        }).join('')));
        tp.appendChild(sc);
      }
      KP.ctl = ctl; KP.stage = stage; KP.reads = reads;
      KP.say = function (t) { document.getElementById('kpSayT').innerHTML = md(t); };
    }

    /* ---- 疑点 ---- */
    if ((cfg.pitfalls || []).length) {
      var pp = panels.pit;
      pp.appendChild(h('div', { class: 'kp-card' },
        '<p class="kp-note">下面几条是这个知识点上学生最常出错的地方。' +
        '每条按「常见说法 → 为什么错 → 正确理解」拆开，可以直接拿去当课堂提问。</p>'));
      cfg.pitfalls.forEach(function (p, i) {
        var el = h('div', { class: 'kp-pit' });
        el.innerHTML =
          '<div class="no">疑点 ' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="q">' + md(p.q) + '</div>' +
          '<dl>' +
          '<dt>常见说法</dt><dd>' + md(p.say) + '</dd>' +
          '<dt>为什么错</dt><dd>' + md(p.why) + '</dd>' +
          '<dt class="right">正确理解</dt><dd class="right">' + md(p.right) + '</dd>' +
          '</dl>';
        pp.appendChild(el);
      });
    }

    /* ---- 自测 ---- */
    if ((cfg.quiz || []).length) {
      var qp = panels.quiz, right = 0, answered = 0;
      var score = h('div', { class: 'kp-score' });
      cfg.quiz.forEach(function (item, i) {
        var q = h('div', { class: 'kp-q' });
        q.appendChild(h('div', { class: 'qh' },
          '<span class="qn">Q' + (i + 1) + '</span><span class="qt">' + md(item.q) + '</span>'));
        var exp = h('div', { class: 'kp-exp' }, md(item.x));
        item.o.forEach(function (o, j) {
          var b = h('button', { class: 'kp-opt' }, 'ABCD'[j] + '．' + md(o));
          b.onclick = function () {
            Array.prototype.forEach.call(q.querySelectorAll('.kp-opt'), function (x, k) {
              x.classList.add('lock');
              if (k === item.a) x.classList.add('ok');
            });
            if (j !== item.a) b.classList.add('no'); else right++;
            answered++;
            exp.classList.add('show');
            exp.classList.toggle('bad', j !== item.a);
            score.innerHTML = '答对 <b>' + right + '</b> / ' + cfg.quiz.length +
              '　已答 ' + answered;
          };
          q.appendChild(b);
        });
        q.appendChild(exp);
        qp.appendChild(q);
      });
      score.innerHTML = '答对 <b>0</b> / ' + cfg.quiz.length + '　已答 0';
      qp.appendChild(score);
    }

    /* ---- 页脚 ---- */
    var foot = h('div', { class: 'kp-foot' });
    foot.innerHTML =
      '<b>出处</b>　' + esc(cfg.source || '') + '<br>' +
      (cfg.note ? esc(cfg.note) + '<br>' : '') +
      '<b>用法</b>　本页可独立打开，也可作为单元资源嵌入平台（自适应容器宽度）。';
    if ((cfg.related || []).length) {
      foot.appendChild(h('div', { class: 'kp-rel' },
        cfg.related.map(function (r) {
          return '<a class="kp-btn" href="' + esc(r[1]) + '">' + esc(r[0]) + ' →</a>';
        }).join('')));
    }
    wrap.appendChild(foot);

    KP.select = select;
    return KP;
  }

  /* 给讲解区加一个控制按钮组，返回一个 setter */
  KP.buttons = function (items, onPick, initial) {
    var btns = items.map(function (it) {
      var b = document.createElement('button');
      b.className = 'kp-btn';
      b.textContent = it.t;
      b.dataset.k = it.k;
      b.onclick = function () { pick(it.k); };
      KP.ctl.appendChild(b);
      return b;
    });
    function pick(k) {
      btns.forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });
      onPick(k);
    }
    pick(initial || items[0].k);
    return pick;
  };
  /* 写读数格 */
  KP.setReads = function (list) {
    KP.reads.innerHTML = list.map(function (r) {
      return '<div class="kp-read"><div class="k">' + esc(r[0]) + '</div>' +
        '<div class="v ' + (r[2] || '') + '">' + esc(r[1]) + '</div></div>';
    }).join('');
  };
  KP.md = md;
  global.KP = KP;
})(window);

</script>

<script>
/* ============================================================
   mcustruct.js  ·  80C51 整体结构 / DIP40 引脚 / CPU 内部
   ------------------------------------------------------------
   对照教材：韩兴国《微控制器原理及接口控制技术》
     2.1   80C51 的基本结构   （13 条主要性能）
     2.1.1 结构简图           图 2-1
     2.1.2 外部引脚           图 2-2 DIP40、表 2-1 P3 第二功能
     2.2   80C51 的 CPU       图 2-3 内部逻辑结构
     2.2.1 运算器 ALU/ACC/B/PSW   表 2-2、表 2-3 PSW 各位
     2.2.2 控制器 IR/ID/控制逻辑电路
     2.2.3 其他寄存器 PC/SP/DPTR/P0~P3/SBUF/R0~R7
   配套课件 S7–S32。
   ============================================================ */
(function (global) {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(n);
    return n;
  }

  function shell(host, w, h) {
    host.innerHTML = '';
    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, class: 'ms-svg', preserveAspectRatio: 'xMidYMid meet' }, host);
    var L = {};
    ['wire', 'body', 'label', 'hit'].forEach(function (n) { L[n] = el('g', { class: 'ms-l-' + n }, svg); });
    var reg = { svg: svg, L: L, groups: {} };
    reg.ring = el('rect', { x: 0, y: 0, width: 0, height: 0, rx: 8, class: 'ms-ring' }, L.hit);
    reg.hit = function (x, y, w2, h2, key) {
      return el('rect', { x: x, y: y, width: w2, height: h2, class: 'ms-hit', 'data-ex': key }, L.hit);
    };
    reg.focus = function (key, EX) {
      var h2 = key && svg.querySelector('.ms-hit[data-ex="' + key + '"]');
      if (!h2) { reg.ring.setAttribute('width', 0); return null; }
      reg.ring.setAttribute('x', +h2.getAttribute('x') - 4);
      reg.ring.setAttribute('y', +h2.getAttribute('y') - 4);
      reg.ring.setAttribute('width', +h2.getAttribute('width') + 8);
      reg.ring.setAttribute('height', +h2.getAttribute('height') + 8);
      return EX[key] || null;
    };
    return reg;
  }

  /* 圆角方块 + 两行文字 */
  function blk(reg, x, y, w, h, l1, l2, cls) {
    el('rect', { x: x, y: y, width: w, height: h, rx: 6, class: 'ms-box ' + (cls || '') }, reg.L.body);
    if (l2) {
      el('text', { x: x + w / 2, y: y + h / 2 - 4, class: 'ms-t ms-t-b', 'text-anchor': 'middle', text: l1 }, reg.L.label);
      el('text', { x: x + w / 2, y: y + h / 2 + 15, class: 'ms-t ms-t-s', 'text-anchor': 'middle', text: l2 }, reg.L.label);
    } else {
      el('text', { x: x + w / 2, y: y + h / 2 + 5, class: 'ms-t ms-t-b', 'text-anchor': 'middle', text: l1 }, reg.L.label);
    }
  }
  function arrow(reg, d, cls) {
    el('path', { d: d, class: 'ms-w ' + (cls || ''), 'marker-end': 'url(#msArr)' }, reg.L.wire);
  }
  function defsArrow(svg) {
    var defs = el('defs', null, svg);
    var m = el('marker', {
      id: 'msArr', viewBox: '0 0 10 10', refX: '9', refY: '5',
      markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse'
    }, defs);
    el('path', { d: 'M0,1 L9,5 L0,9 z', class: 'ms-arrhead' }, m);
  }

  /* ============================================================
     一、结构简图（教材图 2-1）—— 同时充当本章枢纽
     ============================================================ */
  var STRUCT_EX = {
    osc: ['振荡器及定时电路', '片内振荡器，振荡频率 fosc 范围 1.2 ~ 12 MHz，可供时钟输出。它把晶振的振荡分频成状态周期、机器周期，是全机的节拍来源。', '时钟'],
    rom: ['4 KB ROM（程序存储器）', '片内程序存储器，存放程序代码。8031 没有这一块，程序必须放在片外。此外 80C51 还具有 64 KB 的程序存储器寻址能力。', '存储'],
    ram: ['128 B RAM（数据存储器）', '片内数据存储器，分为工作寄存器区 00H~1FH、位寻址区 20H~2FH 和用户 RAM 区 30H~7FH。另有 21 个专用寄存器分布在 80H~FFH。片外数据存储器寻址能力 64 KB。', '存储'],
    timer: ['2 × 16 位定时 / 计数器', '两个 16 位可编程定时/计数器。计数信号从外部引脚（T0 = P3.4、T1 = P3.5）进来，也可以对内部机器周期计数当定时器用。详见后续章节。', ''],
    cpu: ['CPU', '8 位 CPU，含布尔处理器。由运算器（ALU、ACC、B、PSW）、控制器（IR、ID、控制逻辑电路）和其他寄存器（PC、SP、DPTR 等）组成。它读取并分析指令，控制各功能部件执行操作。', 'CPU'],
    bus: ['总线', '把 CPU、存储器和各功能部件连起来的公共通道。对外表现为：P0 送低 8 位地址与 8 位数据（分时复用），P2 送高 8 位地址，ALE、PSEN、RD、WR 等作控制信号。', ''],
    busext: ['64 KB 总线扩展控制器', '负责片外扩展时的总线时序：ALE 锁存低 8 位地址、PSEN 选通外部程序存储器、RD/WR 选通外部数据存储器。程序和数据各有 64 KB 寻址能力。', '存储'],
    pio: ['并行口（8 位）× 4', 'P0、P1、P2、P3 四个 8 位并行 I/O 口，共 32 条 I/O 线。除作通用输入/输出外，P0、P2 还兼作地址/数据总线，P3 各脚带第二功能。', 'IO'],
    serial: ['串行口', '1 个可编程全双工串行 I/O 接口（UART），可实现多机通信。收发引脚是 P3.0（RXD）和 P3.1（TXD）。详见后续章节。', ''],
    intr: ['中断系统', '5 个中断源、2 个优先级。外部中断请求从 P3.2（INT0）、P3.3（INT1）进来，内部中断来自定时/计数器和串行口。详见后续章节。', ''],
    pins: ['地址 / 数据总线端口 · I/O 线', '这一排就是芯片对外的 32 条 I/O 引脚 P0 ~ P3。它们既是通用 I/O，又在扩展时充当地址总线、数据总线和控制线。', 'IO']
  };

  function StructFig(host) {
    var W = 980, H = 540;
    var reg = shell(host, W, H);
    defsArrow(reg.svg);
    var L = reg.L;

    var RA = 92, RB = 296, RC = 410, BUSY = 222, BH = 74;
    var col = [[70, 180], [292, 186], [520, 176], [750, 180]];   // [x, w]

    /* 上排 */
    blk(reg, col[0][0], RA, col[0][1], BH, '振荡器', '及定时电路', 'ms-clk');
    blk(reg, col[1][0], RA, col[1][1], BH, '4 KB ROM', '程序存储器', 'ms-mem');
    blk(reg, col[2][0], RA, col[2][1], BH, '128 B RAM', '数据存储器', 'ms-mem');
    blk(reg, col[3][0], RA, col[3][1], BH, '2 × 16 位', '定时 / 计数器', '');

    /* 总线 */
    el('rect', { x: 60, y: BUSY, width: 880, height: 26, rx: 6, class: 'ms-bus' }, L.body);
    el('text', { x: 500, y: BUSY + 18, class: 'ms-t ms-t-bus', 'text-anchor': 'middle', text: '总　　线' }, L.label);
    col.forEach(function (c) {
      el('path', { d: 'M' + (c[0] + c[1] / 2) + ',' + (RA + BH) + ' V' + BUSY, class: 'ms-w' }, L.wire);
    });

    /* 下排 */
    blk(reg, col[0][0], RB, col[0][1], BH, 'CPU', '', 'ms-cpu');
    blk(reg, col[1][0], RB, col[1][1], BH, '64 KB 总线', '扩展控制器', 'ms-mem');
    blk(reg, col[2][0], RB, col[2][1], BH, '并行口（8 位）', 'P0 · P1 · P2 · P3', 'ms-io');
    blk(reg, col[3][0], RB, col[3][1], BH, '串行口', 'UART 全双工', '');
    col.forEach(function (c) {
      el('path', { d: 'M' + (c[0] + c[1] / 2) + ',' + (BUSY + 26) + ' V' + RB, class: 'ms-w' }, L.wire);
    });

    /* 中断系统 */
    blk(reg, col[0][0], RC, col[0][1], 62, '5 个中断源', '2 个优先级', '');
    el('path', { d: 'M160,' + (RB + BH) + ' V' + RC, class: 'ms-w' }, L.wire);

    /* 外部信号 */
    arrow(reg, 'M160,46 V' + (RA - 4));
    el('text', { x: 160, y: 36, class: 'ms-t ms-t-ext', 'text-anchor': 'middle', text: '时钟源' }, L.label);
    arrow(reg, 'M840,46 V' + (RA - 4));
    el('text', { x: 840, y: 36, class: 'ms-t ms-t-ext', 'text-anchor': 'middle', text: '计数信号' }, L.label);
    arrow(reg, 'M30,' + (RC + 31) + ' H' + (col[0][0] - 4));
    el('text', { x: 24, y: RC + 26, class: 'ms-t ms-t-ext', 'text-anchor': 'start', text: '内部 / 外部' }, L.label);
    el('text', { x: 24, y: RC + 54, class: 'ms-t ms-t-ext', 'text-anchor': 'start', text: '中断信号' }, L.label);

    /* 对外引脚行 */
    var PY = 470;
    el('rect', { x: 292, y: PY, width: 404, height: 44, rx: 6, class: 'ms-box ms-io' }, L.body);

  /* ============================================================

  var PINS = (function () {

  function PinoutFig(host) {

  var CPU_EX = {

    acc: ['累加器 ACC（助记符 A）', '最常用的 8 位寄存器，用来存放操作数和运算结果。执行运算前，两个操作数中的一个通常应放在 A 中，运算完成后 A 中便得到结果。字节地址 E0H。'],
    b: ['寄存器 B', '乘除指令中用来存放一个操作数，也用来存放部分运算结果。乘法两个操作数取自 A 和 B，结果低 8 位存在 A、高 8 位存在 B；除法被除数取自 A、除数取自 B，商的整数部分在 A、余数在 B。其他指令中可作普通通用寄存器。字节地址 F0H。'],
    psw: ['程序状态字寄存器 PSW', '8 位寄存器，保存 ALU 的运算结果和 CPU 的状态，供程序查询和判别。字节地址 D0H，可按位寻址。各位含义见下方的位图。'],
    ir: ['指令寄存器 IR', '控制器的入口。包含地址码和操作码信息的指令，先从程序存储器送到 IR 中；地址码形成实际的操作数地址，操作码送往指令译码器 ID。'],
    id: ['指令译码器 ID', '对操作码译码，形成相应指令的电平信号，CPU 据此使控制电路执行该指令的控制信息，完成各类操作。'],
    ctl: ['控制逻辑电路', '控制器是微控制器的神经中枢，与运算器共同组成 CPU。功能是对指令进行读取、译码、执行，并协调各功能部件的正常工作。'],
    pc: ['程序计数器 PC', '独立的 16 位计数器，总是存放下一个要执行的指令地址，寻址范围 64 KB。每读取一条指令，PC 自动加 1。PC 没有地址、不可寻址，不能用 MOV 操作，只能靠跳转、调用等指令改变。上电或复位时 PC 装入 0000H。'],
    sp: ['堆栈指针 SP', '始终指向栈顶的 8 位专用寄存器。入栈时 SP 先加 1 再压入数据；出栈时先弹出数据 SP 再减 1。堆栈遵循"先进后出"，用于断点保护和现场保护。上电或复位时 SP = 07H。'],
    dptr: ['数据指针 DPTR', '16 位专用寄存器，由 DPH（高 8 位）和 DPL（低 8 位）组成，可当 16 位用，也可当两个独立 8 位寄存器用。用于访问 64 KB 外部数据空间（MOVX A,@DPTR）和外部程序空间（MOVC A,@A+DPTR）。'],
    sbuf: ['串行数据缓冲器 SBUF', '两个同名、同地址的专用寄存器：一个存放待发送的数据，一个存放接收到的数据。发送用 MOV SBUF,A；接收用 MOV A,SBUF。'],
    ports: ['端口寄存器 P0 ~ P3', '四个 8 位并行端口的锁存器。通过对锁存器的读/写，实现对相应端口数据的读/写——这正是位电路那一课里的"锁存器"。'],
    regs: ['工作寄存器组 R0 ~ R7', '共 4 组，每组 8 个单元，占用内部 RAM 的 00H ~ 1FH 共 32 个单元。当前用哪一组由 PSW 的 RS1、RS0 两位选择。']
  };

  function CpuFig(host) {

      .forEach(function (h) { reg.hit(h[0], h[1], h[2], h[3], h[4]); });
    [106, 210, 344].forEach(function (x) { el('path', { d: 'M' + x + ',168 V214', class: 'ms-w' }, L.wire); });

    /* 上：控制器 */
    el('rect', { x: 470, y: 54, width: 430, height: 132, rx: 9, class: 'ms-grp ms-grp-ctl' }, L.body);
    el('text', { x: 482, y: 44, class: 'ms-t ms-t-grp', 'text-anchor': 'start', text: '控制器' }, L.label);
    blk(reg, 490, 100, 110, 52, 'IR', '指令寄存器', '');
    blk(reg, 640, 100, 110, 52, 'ID', '指令译码器', '');
    blk(reg, 790, 100, 96, 52, '控制', '逻辑电路', 'ms-cpu');
    arrow(reg, 'M600,126 H636');
    arrow(reg, 'M750,126 H786');
    el('path', { d: 'M545,152 V214', class: 'ms-w' }, L.wire);
    [[490, 100, 110, 52, 'ir'], [640, 100, 110, 52, 'id'], [790, 100, 96, 52, 'ctl']]
      .forEach(function (h) { reg.hit(h[0], h[1], h[2], h[3], h[4]); });

    /* 下：其他寄存器 */
    el('rect', { x: 40, y: 272, width: 860, height: 150, rx: 9, class: 'ms-grp' }, L.body);
    el('text', { x: 52, y: 262, class: 'ms-t ms-t-grp', 'text-anchor': 'start', text: '其他寄存器' }, L.label);
    var items = [
      [60, 'PC', '程序计数器 16 位', 'pc'], [230, 'SP', '堆栈指针 8 位', 'sp'],
      [400, 'DPTR', 'DPH + DPL 16 位', 'dptr'], [570, 'SBUF', '串行数据缓冲器', 'sbuf'],
      [740, 'P0 ~ P3', '端口锁存器', 'ports']
    ];
    items.forEach(function (it) {
      blk(reg, it[0], 296, 140, 58, it[1], it[2], '');
      el('path', { d: 'M' + (it[0] + 70) + ',296 V236', class: 'ms-w' }, L.wire);
      reg.hit(it[0], 296, 140, 58, it[3]);
    });
    blk(reg, 60, 366, 310, 44, 'R0 ~ R7 工作寄存器组 × 4', '占用内部 RAM 00H ~ 1FH，由 PSW 的 RS1、RS0 选择', '');
    reg.hit(60, 366, 310, 44, 'regs');
    el('text', { x: 400, y: 394, class: 'ms-t ms-t-s', 'text-anchor': 'start',
      text: '以上寄存器与 4 KB ROM、128 B RAM、定时器、串口、中断一起，构成 21 个专用寄存器（SFR）' }, L.label);

    this.reg = reg;
  }
  CpuFig.prototype.focus = function (k) { return this.reg.focus(k, CPU_EX); };

  /* ============================================================
     PSW 各位（教材表 2-2 / 表 2-3）

  var PSW_BITS = [
    ['D7', 'CY', 'PSW.7', '进位标志', '运算结果的最高位 D7 有进位（加法）或借位（减法）时 CY = 1，否则 CY = 0。'],
    ['D6', 'AC', 'PSW.6', '辅助进位标志', '运算结果的低 4 位有进位（加法）或借位（减法）时 AC = 1，否则 AC = 0。AC 常用于十进制调整。注：教材表 2-3 里写作"自动进位标志"，正文与通用术语均为"辅助进位"（Auxiliary Carry）。'],
    ['D5', 'F0', 'PSW.5', '用户标志位', '由用户自己定义，CPU 不使用它。可以当一个随手用的标志位。'],
    ['D4', 'RS1', 'PSW.4', '寄存器区选择 MSB', '与 RS0 一起选择当前使用哪一组工作寄存器：00→BANK0（00H~07H）、01→BANK1（08H~0FH）、10→BANK2（10H~17H）、11→BANK3（18H~1FH）。'],

  global.StructFig = StructFig;

<script>
KP({
  unit: '单元 2 · 硬件结构',
  unitEn: 'KNOWLEDGE POINT · CPU',
  kp: 'CPU 结构：运算器、控制器与那几个"记事本"',
  lead: 'CPU 不是一个黑盒子。教材把它拆成三块：**运算器**（ALU、ACC、B、PSW）负责算，' +
        '**控制器**（IR、ID、控制逻辑）负责读指令和发号施令，**其他寄存器**（PC、SP、DPTR…）' +
        '各自记着一件要紧的事。把这三块和它们各自"记什么"对上号，后面学指令系统就不会卡。',
  meta: [['大纲　','第 2 章 80C51 基本结构'], ['教材　','2.2 · 图 2-3 · 表 2-2/2-3'], ['用时　','约 12 分钟']],
  teach: {
    intro: '下图按教材图 2-3 重绘。**点任一部件**看它是干什么的；下面那排是 PSW 的八个位，也可以逐位点。',
    title: 'CPU 内部结构 · 可点击',
    caption: '虚线框把 CPU 分成运算器 / 控制器 / 其他寄存器三组；中间横条是内部总线',
    steps: [
      '**运算器**：ALU 做加减乘除与逻辑运算，还带位处理功能（布尔处理器）。ACC 是最常用的 8 位寄存器，B 专为乘除设置，PSW 记录运算结果的状态。',
      '**控制器**：指令先进 IR，操作码送 ID 译码，形成电平信号驱动控制逻辑电路。这是"取指—译码—执行"在硬件上的样子。',
      '**PC 最特殊**：16 位、不可寻址、不能用 MOV 操作，只能靠跳转和调用改变。复位时装入 0000H。',
      '**SP 要记住两个数**：复位值 07H；入栈时**先加 1 再压**，出栈时**先弹再减 1**。'
    ]
  },
  pitfalls: [
    { q: 'PC 也是寄存器，为什么不能用 `MOV PC,#2000H` 改它？',
      say: 'PC 存着下一条指令地址，写它就能跳转，跟改别的寄存器一样。',
      why: '教材写得很明确：**PC 没有地址，是不可寻址的**。SFR 之所以能被 MOV 访问，是因为它们在 80H~FFH 里有字节地址；PC 根本不在这张表上。',
      right: '改 PC 只能靠**跳转、调用类指令**（AJMP / LJMP / SJMP / ACALL / LCALL / RET 等）间接完成。这也是为什么程序流程只能靠这几类指令控制，而不能"赋值跳转"。'
    },
    { q: 'ACC 和 A 是两个东西吗？',
      say: '指令里写 A，寄存器叫 ACC，应该是两个不同的东西。',
      why: '是同一个，只是出现的场合不同。教材：累加器 ACC……在指令系统中，累加器的助记符为 **A**。',
      right: '写指令时用 A（如 `MOV A,#30H`）；讲结构、查 SFR 表时叫 ACC，字节地址 E0H。有一个例外值得注意：在位操作或直接寻址的场合，汇编器可能要求写 ACC 而不是 A，因为要的是那个**地址**而不是那个**寄存器**。'
    },
    { q: 'PSW 里的 P 位（奇偶标志）是谁在维护？',

      why: 'P 和 CY 的触发条件完全不同。CY 只在运算产生进位/借位时变；而 **P 位每执行一条指令都会被重算**，依据是**累加器 A 中 1 的个数**，跟这条指令是不是算术指令无关。',
      right: 'A 中 1 的个数为**奇数**时 P = 1，为**偶数**时 P = 0。它是为串行通信的奇偶校验准备的。所以别拿 P 去判断"刚才那次运算有没有进位"——那是 CY 的活。'

    { q: 'RS1、RS0 选了 BANK1，R0 就"换了一个寄存器"吗？',

  quiz: [

    { q: 'PSW 中用于选择当前工作寄存器组的是（　）。',
      o: ['CY 和 AC','RS1 和 RS0','OV 和 P','F0 和 F1'], a: 1,
      x: 'RS1（PSW.4）与 RS0（PSW.3）组合选 BANK0~BANK3，分别对应片内 RAM 的 00H~07H、08H~0FH、10H~17H、18H~1FH。复位后 PSW = 00H，默认 BANK0。' },
    { q: '数据入栈时，堆栈指针 SP 的变化是（　）。',
      o: ['先压入数据，SP 再加 1','SP 先加 1，再压入数据','SP 先减 1，再压入数据','SP 不变'], a: 1,
      x: 'SP 始终指向栈顶。入栈：SP 先加 1，再把数据压入 SP 指向的单元；出栈：先弹出数据，SP 再减 1。复位时 SP = 07H。' }
  ],
  source: '教材《微控制器原理及接口控制技术》第 2 章 2.2 CPU，图 2-3、表 2-2、表 2-3。',
  note: 'PSW 的 AC 位：教材表 2-3 写作"自动进位标志"，正文与通用术语均为"辅助进位标志"（Auxiliary Carry），本页采用后者。'
});
(function(){
  var host=document.createElement('div'); host.id='cpu'; KP.stage.appendChild(host);
  var cpu=new CpuFig(host);
  var HINT='**点图上的部件**看它的作用：ALU、ACC、B、PSW、IR、ID、控制逻辑电路、PC、SP、DPTR、SBUF、端口寄存器、工作寄存器组。';
  KP.say(HINT);
  host.addEventListener('click',function(e){
    var h=e.target.closest?e.target.closest('.ms-hit'):null;
    if(!h){ cpu.focus(null); KP.say(HINT); return; }
    var i=cpu.focus(h.getAttribute('data-ex'));
    if(i) KP.say('**'+i[0]+'**　'+i[1]);
  });
  /* PSW 八位 */
  var wrap=document.createElement('div');
  wrap.style.cssText='display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px';
  MS_PSW_BITS.forEach(function(b,i){
    var el=document.createElement('button');
    el.className='kp-btn';
    el.style.cssText='flex-direction:column;justify-content:center;gap:3px;padding:8px 4px;text-align:center';
    el.innerHTML='<span style="font-size:9.5px;opacity:.7">'+b[0]+'</span>'+
                 '<span style="font-size:14px;font-weight:700">'+b[1]+'</span>'+
                 '<span style="font-size:9px;opacity:.65">'+b[2]+'</span>';
    el.onclick=function(){
      [].forEach.call(wrap.children,function(x){x.classList.remove('on')});
      el.classList.add('on');
      KP.say('**'+b[1]+'　'+b[3]+'**（'+b[2]+'）　'+b[4]);
    };
    wrap.appendChild(el);
  });
  KP.reads.parentNode.insertBefore(wrap,KP.reads);
  KP.setReads([['运算器','ALU · ACC · B · PSW','hi'],
               ['控制器','IR · ID · 控制逻辑','hi'],
               ['其他寄存器','PC · SP · DPTR · SBUF','hi'],
               ['PSW 字节地址','D0H · 可位寻址','gold']]);
})();
