<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">教学成效证据采集状态</title>
  <desc id="desc">当前已记录平台过程数据，但缺少同口径真实前后测和真实班级数据。真实成绩、课堂观察、问卷与学生成果均待采集，因此不发布教学提升数值。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0.5 L10,4 L0,7.5Z" fill="#244A78"/></marker>
    <style>
      .h1{font:700 26px SimHei,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#fff}
      .h2{font:700 19px SimHei,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#173454}
      .body{font:400 15px SimSun,'Noto Serif SC',serif;fill:#1f2937}
      .small{font:400 13px SimSun,'Noto Serif SC',serif;fill:#53657a}
      .code{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}
      .light{fill:#dbe8f5}
    </style>
  </defs>
  <rect width="900" height="560" fill="#fff"/>
  <rect x="12" y="12" width="876" height="536" rx="2" fill="none" stroke="#244A78" stroke-width="1.8"/>
  <rect x="12" y="12" width="876" height="70" fill="#244A78"/>
  <text x="450" y="48" text-anchor="middle" class="h1">教学成效证据采集状态</text>
  <text x="450" y="70" text-anchor="middle" class="small light">用状态替代未经实测的提升数值</text>

  <g id="recorded">
    <rect x="42" y="120" width="246" height="238" rx="2" fill="#edf7f5" stroke="#0F766E" stroke-width="1.2"/>
    <rect x="42" y="120" width="246" height="42" fill="#0F766E"/>
    <text x="165" y="146" text-anchor="middle" class="code">RECORDED</text>
    <text x="165" y="201" text-anchor="middle" class="h2">过程已记录</text>
    <text x="68" y="240" class="body">• 任务触达与目标对象</text>
    <text x="68" y="273" class="body">• 学习步骤与入口状态</text>
    <text x="68" y="306" class="body">• 测验作答与实验完成</text>
    <text x="165" y="338" text-anchor="middle" class="small">用途：核对功能和过程落盘</text>
  </g>

  <g id="insufficient">
    <rect x="327" y="120" width="246" height="238" rx="2" fill="#fff7e8" stroke="#9A6700" stroke-width="1.2"/>
    <rect x="327" y="120" width="246" height="42" fill="#9A6700"/>
    <text x="450" y="146" text-anchor="middle" class="code">INSUFFICIENT</text>
    <text x="450" y="201" text-anchor="middle" class="h2">成效证据不足</text>
    <text x="353" y="240" class="body">• 当前为演示环境</text>
    <text x="353" y="273" class="body">• 无同口径真实前后测</text>
    <text x="353" y="306" class="body">• 重复作答不等于受控实验</text>
    <text x="450" y="338" text-anchor="middle" class="small">结论：不计算教学增益</text>
  </g>

  <g id="pending">
    <rect x="612" y="120" width="246" height="238" rx="2" fill="#eef4fa" stroke="#244A78" stroke-width="1.2"/>
    <rect x="612" y="120" width="246" height="42" fill="#64748B"/>
    <text x="735" y="146" text-anchor="middle" class="code">PENDING</text>
    <text x="735" y="201" text-anchor="middle" class="h2">待真实采集</text>
    <text x="638" y="240" class="body">• 真实成绩与固定测评</text>
    <text x="638" y="273" class="body">• 课堂观察与问卷</text>
    <text x="638" y="306" class="body">• 可核验学生成果</text>
    <text x="735" y="338" text-anchor="middle" class="small">完成后再按预设口径分析</text>
  </g>

  <line x1="288" y1="239" x2="319" y2="239" stroke="#244A78" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="573" y1="239" x2="604" y2="239" stroke="#244A78" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="42" y="398" width="816" height="108" rx="2" fill="#f5f8fc" stroke="#b8c9dc" stroke-width="1"/>
  <text x="64" y="430" class="h2">允许形成比较结论的最低条件</text>
  <text x="64" y="462" class="body">同一教学对象 · 固定测评编号 · 首测与再次测评规则一致 · 原始记录可复核 · 样本量满足分析要求</text>
  <text x="64" y="491" class="small">任一条件缺失时，页面保持“数据不足”或“待采集”，不显示提升百分比、显著性或因果判断。</text>
  <text x="858" y="532" text-anchor="end" class="small">状态日期：2026-07-31｜当前环境：DEMO</text>
</svg>
