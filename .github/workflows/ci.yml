name: CI

# 这个 workflow 是发布前置检查。仓库和 Vercel 项目还必须将 quality 设为 main
# 的必需检查，并等待同一 SHA 检查通过后才允许生产发布。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 代码质量
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行类型检查
        run: npm run typecheck

      - name: 运行代码检查
        run: npm run lint

      - name: 运行测试
        run: npm test -- --runInBand

      - name: 检查依赖安全
        run: npm audit --audit-level=high

      - name: 验证生产构建
        run: npm run build
