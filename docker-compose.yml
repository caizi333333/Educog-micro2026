services:
  # 应用本体（Next.js standalone 构建产物）
  app:
    build: .
    container_name: educog-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://educog_user:educog_password@postgres:5432/educog_micro
      NODE_ENV: production
      # 以下密钥请在 .env 文件中配置（勿留默认值上线）：
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 中设置 JWT_REFRESH_SECRET}
      PEPPER: ${PEPPER:?请在 .env 中设置 PEPPER}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ILAB_APP_ID: ${ILAB_APP_ID:-}
      ILAB_APP_SECRET: ${ILAB_APP_SECRET:-}
      ILAB_API_BASE: ${ILAB_API_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: educog-postgres
    environment:
      POSTGRES_DB: educog_micro
      POSTGRES_USER: educog_user
      POSTGRES_PASSWORD: educog_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educog_user -d educog_micro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: educog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: educog-network
